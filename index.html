<meta property="og:type" content="website">
<meta property="og:title" content="程文辉的作品集">
<meta property="og:description" content="收录物业服务方案、演示材料和管理工具。">

<style>
@font-face{font-family:"Wenhui Serif";src:url(assets/serif-600.woff2) format("woff2");font-weight:600;font-display:swap}

:root{
  --stone:#EDEFEB;   /* page */
  --paper:#F7F8F5;   /* record card */
  --ink:#1B231F;     /* text */
  --muted:#56615B;   /* secondary text */
  --line:#C9D0C9;    /* rules */
  --brass:#7A5820;   /* links */
  --brass-fill:#7A5820;
  --on-brass:#FFFFFF;
  --hl:#F2DFA6;      /* highlighter */
  --hl-ink:#1B231F;
  --f-serif:"Wenhui Serif","Noto Serif SC","Source Han Serif SC","Songti SC","STSong",serif;
  --f-sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Segoe UI","Microsoft YaHei UI","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --stone:#131714;--paper:#1A1F1C;--ink:#E6EAE6;--muted:#9AA49E;--line:#2E3631;
    --brass:#D6B67C;--brass-fill:#D6B67C;--on-brass:#1B160C;
    --hl:#4A3E22;--hl-ink:#F4E6C4;
  }
}
:root[data-theme="dark"]{
  --stone:#131714;--paper:#1A1F1C;--ink:#E6EAE6;--muted:#9AA49E;--line:#2E3631;
  --brass:#D6B67C;--brass-fill:#D6B67C;--on-brass:#1B160C;
  --hl:#4A3E22;--hl-ink:#F4E6C4;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--stone);color:var(--ink);font:400 16px/1.75 var(--f-sans);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:var(--brass);text-underline-offset:.22em;text-decoration-thickness:1px}
a:focus-visible{outline:2px solid var(--brass);outline-offset:4px;border-radius:2px}
img{display:block;max-width:100%;height:auto}

.page{max-width:747px;margin:0 auto;   /* 电脑上内容宽 667px，比原来的 1000px 窄三分之一 */
  padding:calc(40px + env(safe-area-inset-top,0px)) 16px calc(28px + env(safe-area-inset-bottom,0px))}

.works h2{margin:0 0 16px;font-family:var(--f-serif);font-weight:600;font-size:20px;line-height:1.3;
  padding-bottom:10px;border-bottom:1px solid var(--line)}

/* 作品卡：每项作品占一行，左边封面、右边标题，三项作品一屏看完不用翻。
   卡片只放封面、标题、简介和入口，不放数字统计（主人明确不要）。
   手机：封面 | 标题；平板（卡片宽 ≥480px）再加两行简介；电脑（≥840px）：封面 | 标题、简介、入口。
   封面会裁得比 16:9 窄，主体不在正中的封面在 img 上用 object-position 指定保留哪边。 */
.list{display:grid;gap:10px}
.work{position:relative;display:grid;grid-template-columns:40% minmax(0,1fr);grid-template-rows:1fr auto;
  container:work/inline-size;
  background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:hidden;
  transition:border-color .2s,box-shadow .2s,transform .2s}
.work:hover{border-color:var(--brass);transform:translateY(-2px);
  box-shadow:0 18px 36px -24px rgba(20,30,25,.5)}
.work:focus-within{outline:2px solid var(--brass);outline-offset:3px}
.thumb{position:relative;grid-row:1 / 3;min-height:calc(40cqi * 9 / 16);background:#000;border-right:1px solid var(--line)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.head{align-self:center;padding:10px 12px 8px}   /* 手机上标题在封面旁上下居中 */
.work h3{margin:0;font-family:var(--f-serif);font-weight:600;font-size:16px;line-height:1.4;letter-spacing:.02em;text-wrap:balance}
.work h3 a{color:inherit;text-decoration:none}
.work h3 a:focus-visible{outline:0}
.work h3 a::after{content:"";position:absolute;inset:0;z-index:1}   /* 整张卡片都可点 */
.desc{display:none;margin:4px 0 0;font-size:13px;line-height:1.7;color:var(--muted);
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.go{display:none;font-size:13px;font-weight:600;color:var(--brass)}


/* 平板：卡片宽，右边补上两行简介 */
@container work (width >= 480px){
  .desc{display:-webkit-box}
}

/* 很窄的手机（如 320 宽）：封面再窄一点，给标题留位置；标题字距收紧 */
@media (max-width:359px){
  .work{grid-template-columns:36% minmax(0,1fr)}
  .thumb{min-height:calc(36cqi * 9 / 16)}
  .work h3{letter-spacing:0}
}

/* 电脑：封面 | 标题（一行）、两行简介、入口 */
@media (min-width:840px){
  .work{grid-template-columns:240px minmax(0,1fr)}
  .thumb{min-height:135px}
  .head{grid-column:2;grid-row:1;align-self:start;padding:14px 20px 4px}
  .work h3{font-size:19px}
  .work h3 br{display:none}
  .desc{display:-webkit-box;font-size:13.5px}
  .go{display:block;grid-column:2;grid-row:2;padding:0 20px 12px}
}

.foot{position:relative;margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);
  display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 16px}

/* 钥匙牌：页脚角落的隐形开关，图标不显示，位置和点击区域保留 */
.foot-r{display:inline-flex;align-items:center;gap:10px;margin-left:auto}
.mail{margin-right:6px;white-space:nowrap}
/* 窄屏：邮箱和版权单独一行，靠右 */
@media (max-width:559px){.foot-r{flex-basis:100%;justify-content:flex-end}}
.keytag{display:inline-block;width:18px;height:27px;color:var(--brass);opacity:0;cursor:default;
  transform-origin:50% 4px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none}
.keytag svg{display:block;width:100%;height:100%;overflow:visible}
.keytag .body{fill:var(--paper)}
.keytag .hole{fill:var(--stone)}
.keytag.sway{animation:sway 1.1s ease-in-out}
@media (hover:hover){.keytag:hover{animation:sway 1.1s ease-in-out}}
@keyframes sway{0%,100%{transform:rotate(0)}20%{transform:rotate(9deg)}45%{transform:rotate(-6deg)}70%{transform:rotate(3deg)}}

/* 访客数：只显示一个数字的小胶囊 */
.stats{position:fixed;z-index:30;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  min-width:52px;padding:4px 14px;background:var(--paper);color:var(--brass);
  border:1px solid var(--line);border-radius:999px;box-shadow:0 10px 24px -14px rgba(20,30,25,.5);
  font:600 18px/1.2 var(--f-sans);font-variant-numeric:tabular-nums;text-align:center;cursor:default;
  opacity:0;visibility:hidden;transform:translateY(6px) scale(.96);
  transition:opacity .18s,transform .18s,visibility 0s .18s}
.stats.open{opacity:1;visibility:visible;transform:none;transition:opacity .18s,transform .18s}
/* 窄屏时停在作品卡和页脚线之间、靠右，不挡住钥匙牌；跟着页脚走，页面翻不翻都在同一位置 */
@media (max-width:1279px){.stats{position:absolute;right:0;bottom:calc(100% + 4px)}}

@media (min-width:560px){
  .list{gap:14px}
}
@media (min-width:840px){
  .page{padding:48px 40px 24px}
}
@media (prefers-reduced-motion:reduce){.keytag,.keytag.sway,.keytag:hover{animation:none}.work,.work:hover{transition:none;transform:none}.stats{transition:none;transform:none}}
@media print{.keytag,.stats{display:none}}
</style>
</head>
<body>
<main class="page">
  <section class="works" aria-labelledby="works-h">
    <h2 id="works-h">作品</h2>

    <div class="list">
      <article class="work">

      <article class="work">

  <footer class="foot">
    <span>个人作品展示页，非企业官方网站。</span>
    <span class="foot-r"><a class="mail" href="mailto:timchingx@gmail.com">timchingx@gmail.com</a>© 2026 程文辉<span class="keytag" id="keytag" aria-hidden="true"><svg viewBox="0 0 24 36"><rect class="body" x="4" y="10" width="16" height="24" rx="3" stroke="currentColor" stroke-width="1.5"/><circle class="hole" cx="12" cy="14" r="1.6" stroke="currentColor" stroke-width="1.2"/><path d="M12 14A6 6 0 1 1 17.2 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M7.5 29V24.5L12 21l4.5 3.5V29" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></svg></span></span>
    <div class="stats" id="stats" aria-label="访客数"><span id="vercount_value_site_uv">–</span></div>
  </footer>
</main>

<script>
(function(){
  var tag=document.getElementById('keytag'),panel=document.getElementById('stats');
  if(!tag||!panel)return;
  function setOpen(v){panel.classList.toggle('open',v)}
  function toggle(){setOpen(!panel.classList.contains('open'))}
  function sway(){tag.classList.remove('sway');void tag.offsetWidth;tag.classList.add('sway')}
  tag.addEventListener('animationend',function(){tag.classList.remove('sway')});

  // 手机：3 秒内连点钥匙牌 6 下
  var taps=[];
  tag.addEventListener('click',function(){
    var now=Date.now();sway();
    taps=taps.filter(function(t){return now-t<3000});taps.push(now);
    if(taps.length>=6){taps=[];toggle()}
  });

  // 电脑：键盘输入 666
  var buf='',last=0;
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){setOpen(false);return}
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    var t=e.target;
    if(t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)))return;
    var now=Date.now();if(now-last>1500)buf='';last=now;
    buf=(buf+e.key).slice(-3);
    if(buf==='666'){buf='';toggle()}
  });

  // 点数字本身或页面其他地方都会收起
  document.addEventListener('click',function(e){
    if(panel.classList.contains('open')&&!tag.contains(e.target))setOpen(false);
  });
})();
</script>
<script defer src="https://events.vercount.one/js"></script>
