<script>/* 封快捷键：开发者工具（F12、⌘⌥I/J/C、Ctrl+Shift+I/J/C）、查看源码（⌘⌥U、Ctrl+U）、另存为（⌘/Ctrl+S）、打印（⌘/Ctrl+P） */
document.addEventListener('keydown', function(e){
  var c = e.code || '', k = String(e.key || '').toLowerCase(), mod = e.metaKey || e.ctrlKey;
  var block = c === 'F12' || k === 'f12'
    || (mod && (c === 'KeyS' || c === 'KeyU' || c === 'KeyP' || k === 's' || k === 'u' || k === 'p'))
    || (mod && (e.altKey || e.shiftKey) && /^Key[IJCU]$/.test(c));
  if (block) { e.preventDefault(); e.stopPropagation(); }
}, true);
</script>
<style>
/* 社论式首页（2026-10-25 改版）
   跟央玺花园演示同一套：象牙纸色底、暖黑字、衬线标题、等宽小字标签、陶土橘点缀，细线分隔，不用阴影。
   电脑上三张并排的燕麦色卡片，截图从卡片底边升起；手机上是细线分隔的列表，三项作品一屏看完。作品按日期从新到旧排。
   截图按封面原比例 16:9 整张显示，不裁切。
   作品卡不放数字统计，也不放署名，只显示日期；标题一行放下。座右铭留在页脚，不放页面上方。
   顶部不放刊头。页面至少一屏高，页脚贴在屏幕底部；电脑上卡片在上方留白里略高于正中。
   日期、版权、类别小字在燕麦色卡片上对比度都不低于 4.5:1。 */
@font-face{font-family:"YX Serif";font-weight:500;font-display:swap;src:url(assets/home-serif-500.woff2) format("woff2")}
@font-face{font-family:"YX Serif";font-weight:400;font-display:swap;src:url(assets/home-serif-400.woff2) format("woff2")}
@font-face{font-family:"YX Mono";font-weight:500;font-display:swap;src:url(assets/home-mono-500.woff2) format("woff2")}
:root{
  --paper:#FAF9F5;     /* 页面底色：象牙纸色 */
  --oat:#F0EEE6;       /* 卡片 */
  --oat2:#E8E6DC;      /* 卡片悬停、联系按钮悬停 */
  --ink:#141413;       /* 正文：暖黑 */
  --ink2:#5E5D59;      /* 简介 */
  --ink3:#6C6B66;      /* 日期、版权（燕麦色上 4.6:1） */
  --rule:rgba(20,20,19,.14);   /* 细线 */
  --clay:#D97757;      /* 陶土橘 */
  --clay-d:#AA5333;    /* 类别小字（燕麦色上 4.5:1） */
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","PingFang SC","Hiragino Sans GB","Segoe UI","Microsoft YaHei UI","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC",sans-serif;
  --f-serif:"YX Serif","Noto Serif SC","Source Han Serif SC","Songti SC","STSong",serif;
  --f-mono:"YX Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.6 var(--f);
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:2px solid var(--clay);outline-offset:3px;border-radius:4px}
img{display:block;max-width:100%;height:auto}
.wrap{max-width:1200px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.mono{font-family:var(--f-mono);font-weight:500;letter-spacing:.06em;text-transform:uppercase}
/* 只给读屏软件和搜索引擎看的标题，页面上不显示 */
.vh{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
/* 页面至少一屏高，页脚贴在屏幕底部：作品和页脚之间用一块会伸缩的留白隔开（最少 40px） */
.wrap{display:flex;flex-direction:column;min-height:100vh;min-height:100svh}
.works,.foot{width:100%}
.works{order:1}
.wrap::after{content:"";order:2;flex:1 0 40px}
.foot{order:3}

/* ---------- 作品：手机上是细线分隔的列表 ---------- */
.works{margin:calc(24px + env(safe-area-inset-top,0px)) 0 0;padding:0;list-style:none}
.work{position:relative;display:grid;grid-template-columns:128px minmax(0,1fr) 12px;
  grid-template-areas:"shot text chev";column-gap:14px;align-items:center;padding:16px 0;border-bottom:1px solid var(--rule)}
.text{grid-area:text;min-width:0}
.shot{grid-area:shot;position:relative;aspect-ratio:16 / 9;border-radius:6px;overflow:hidden;background:var(--oat)}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.shot::after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 0 0 1px var(--rule);pointer-events:none}
.chev{grid-area:chev;width:12px;height:12px;color:var(--ink3)}
.kind{margin:0 0 3px;font-size:12px;line-height:1.4;font-weight:600;letter-spacing:.04em;color:var(--clay-d)}
.work h2{margin:0;font:500 18px/1.3 var(--f-serif);letter-spacing:.02em;white-space:nowrap;color:var(--ink)}
.work h2 a{-webkit-tap-highlight-color:transparent}
.work h2 a::after{content:"";position:absolute;inset:0;z-index:1}   /* 整行、整张卡都可点 */
.work h2 a:focus-visible{outline:0}
.work:has(h2 a:focus-visible){outline:2px solid var(--clay);outline-offset:4px;border-radius:8px}
.desc{display:none;margin:8px 0 0;font-size:14px;line-height:1.65;color:var(--ink2);text-wrap:pretty;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;align-items:center;justify-content:space-between;margin:6px 0 0;font-size:11.5px;line-height:1.4;color:var(--ink3)}
.meta .go{display:none}
.work:active{background:var(--oat)}
.work:last-child{border-bottom:0}

/* 平板：列表行加大，补上两行简介 */
@media (min-width:560px){
  .wrap{padding-left:32px;padding-right:32px}
  .works{max-width:760px;margin:calc(48px + env(safe-area-inset-top,0px)) auto 0}
  .work{grid-template-columns:224px minmax(0,1fr) 12px;column-gap:24px;padding:22px 0}
  .work h2{font-size:22px}
  .desc{display:-webkit-box}
  .meta{margin-top:10px}
}
/* 很窄的手机（如 320 宽）：封面再小一点，给标题留位置 */
@media (max-width:359px){
  .work{grid-template-columns:104px minmax(0,1fr) 12px;column-gap:12px}
  .work h2{font-size:16.5px}
}

/* ---------- 电脑：三张并排的燕麦色卡片，截图从卡片底边升起 ---------- */
@media (min-width:860px){
  .wrap{padding-left:40px;padding-right:40px}
  .wrap::before{content:"";order:0;flex:2 0 0}   /* 卡片上下的留白按 2:3 分，看起来略高于正中 */
  .wrap::after{flex:3 0 56px}
  .works{max-width:none;margin-top:calc(72px + env(safe-area-inset-top,0px));display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
  .work{display:flex;flex-direction:column;align-items:stretch;padding:30px 30px 0;background:var(--oat);border:0;border-radius:12px;overflow:hidden;
    transition:background-color .3s}
  .chev{display:none}
  .work:active{background:var(--oat2)}
  .work:has(h2 a:focus-visible){outline-offset:4px;border-radius:12px}
  .kind{font-size:13px;margin-bottom:8px}
  .work h2{font-size:clamp(20px,2.15vw,27px);line-height:1.25}
  .desc{display:block;margin-top:14px;font-size:14.5px;line-height:1.7}
  .meta{margin-top:18px;padding-top:12px;border-top:1px solid var(--rule);font-size:12px}
  .meta .go{display:block;width:16px;height:16px;color:var(--ink);transition:transform .3s cubic-bezier(.2,.7,.2,1)}
  .text{padding-bottom:30px}
  .shot{order:2;margin-top:auto;border-radius:8px 8px 0 0;background:var(--paper);transition:transform .45s cubic-bezier(.2,.7,.2,1)}
  .shot::after{box-shadow:inset 0 1px 0 var(--rule),inset 1px 0 0 var(--rule),inset -1px 0 0 var(--rule)}
}
/* 三张卡的类别、标题、简介、日期线、截图各自对齐（浏览器支持 subgrid 时） */
@supports (grid-template-rows:subgrid){
  @media (min-width:860px){
    .work{display:grid;grid-template-columns:minmax(0,1fr);grid-template-areas:none;grid-template-rows:subgrid;grid-row:span 5;row-gap:0}
    .shot{grid-area:auto}
    .text{display:contents}
    .meta{align-self:start;margin-bottom:30px}
    .shot{align-self:end}
  }
}
@media (min-width:860px) and (hover:hover) and (pointer:fine){
  .work:hover{background:var(--oat2)}
  .work:hover .shot{transform:translateY(-6px)}
  .work:hover .meta .go{transform:translateX(4px)}
}

/* ---------- 页脚 ---------- */
.foot{position:relative;margin-top:0;padding:22px 0 calc(28px + env(safe-area-inset-bottom,0px));
  border-top:1px solid var(--rule);font-size:12px;line-height:1.4;color:var(--ink3);
  display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;align-items:center;gap:12px 16px}
/* 座右铭：页脚正中一行衬线小字，低调，不放页面上方。 */
.motto{margin:0;text-align:center;text-wrap:balance;font:400 15px/1.5 var(--f-serif);color:var(--ink2)}
/* 座右铭在上、版权和联系在它下面（版权在左、联系在右），都居中；左边补 28px 抵消右端看不见的钥匙牌，让可见部分正好居中 */
.foot-r{display:inline-flex;align-items:center;gap:10px;padding-left:28px}
@media (min-width:560px){.foot{max-width:760px;margin-left:auto;margin-right:auto}}
@media (min-width:860px){.foot{max-width:none}.motto{font-size:16px}}
/* 联系按钮：一个细线信封图标，点开发邮件；鼠标停留时提示邮箱地址，悬停垫一圈燕麦色 */
.contact{display:inline-grid;place-items:center;width:30px;height:30px;margin-left:2px;border-radius:999px;color:var(--ink2);
  transition:background-color .2s,color .2s}
.contact svg{display:block;width:17px;height:17px}
.contact:hover{background:var(--oat);color:var(--ink)}

/* 钥匙牌：页脚角落的隐形开关，图标不显示，位置和点击区域保留 */
.keytag{display:inline-block;width:18px;height:27px;color:var(--ink);opacity:0;cursor:default;
  transform-origin:50% 4px;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;user-select:none}
.keytag svg{display:block;width:100%;height:100%;overflow:visible}
.keytag .body{fill:var(--oat)}
.keytag .hole{fill:var(--paper)}
.keytag.sway{animation:sway 1.1s ease-in-out}
@media (hover:hover){.keytag:hover{animation:sway 1.1s ease-in-out}}
@keyframes sway{0%,100%{transform:rotate(0)}20%{transform:rotate(9deg)}45%{transform:rotate(-6deg)}70%{transform:rotate(3deg)}}

/* 访客数：只显示一个数字的小胶囊 */
.stats{position:fixed;z-index:30;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  min-width:52px;padding:4px 14px;background:var(--paper);color:var(--clay-d);
  border-radius:999px;box-shadow:0 0 0 1px var(--rule),0 10px 24px -12px rgba(20,20,19,.35);
  font:500 16px/1.4 var(--f-mono);font-variant-numeric:tabular-nums;text-align:center;cursor:default;
  opacity:0;visibility:hidden;transform:translateY(6px) scale(.96);
  transition:opacity .18s,transform .18s,visibility 0s .18s}
.stats.open{opacity:1;visibility:visible;transform:none;transition:opacity .18s,transform .18s}
@media (max-width:1279px){.stats{position:absolute;right:0;bottom:calc(100% + 8px)}}

/* 开场：作品依次淡入上浮，只放一次 */
@media (prefers-reduced-motion:no-preference){
  .work{animation:rise .8s cubic-bezier(.2,.7,.2,1) backwards}
  .work:nth-child(1){animation-delay:.08s}
  .work:nth-child(2){animation-delay:.16s}
  .work:nth-child(3){animation-delay:.24s}
  .work:nth-child(n+4){animation-delay:.32s}
}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){
  .contact,.work,.shot,.meta .go{transition:none}
  .keytag,.keytag.sway,.keytag:hover{animation:none}
  .stats{transition:none}.work:hover .shot,.work:hover .meta .go{transform:none}.stats{transform:none}
}
/* 禁止选中、拖拽和打印：打印或另存为 PDF 时只输出一行提示，不输出作品内容 */
html{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img,svg{-webkit-user-drag:none}
@media print{
  @page{size:A4;margin:20mm}
  html,body{background:#fff !important}
  body > *{display:none !important}
  body::before{content:"本作品仅供在线浏览，不提供打印或导出。";display:block;padding-top:40mm;text-align:center;font-size:16pt;color:#333}
}
</style>

<script>
(function(){
  var tag=document.getElementById('keytag'),panel=document.getElementById('stats');
  if(!tag||!panel)return;
  function setOpen(v){panel.classList.toggle('open',v)}
  function toggle(){setOpen(!panel.classList.contains('open'))}
  function sway(){tag.classList.remove('sway');void tag.offsetWidth;tag.classList.add('sway')}
  tag.addEventListener('animationend',function(){tag.classList.remove('sway')});

  // 手机：3 秒内连点钥匙牌 6 下
  var taps=[];
  tag.addEventListener('click',function(){
    var now=Date.now();sway();
    taps=taps.filter(function(t){return now-t<3000});taps.push(now);
    if(taps.length>=6){taps=[];toggle()}
  });

  // 电脑：键盘输入 666
  var buf='',last=0;
  document.addEventListener('keydown',function(e){
    if(e.key==='Escape'){setOpen(false);return}
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    var t=e.target;
    if(t&&(t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)))return;
    var now=Date.now();if(now-last>1500)buf='';last=now;
    buf=(buf+e.key).slice(-3);
    if(buf==='666'){buf='';toggle()}
  });

  // 点数字本身或页面其他地方都会收起
  document.addEventListener('click',function(e){
    if(panel.classList.contains('open')&&!tag.contains(e.target))setOpen(false);
  });
})();
</script>
<script>/* 整份作品禁止复制：拦截复制、剪切、右键菜单、选中与拖拽（输入框除外）；禁止打印 */
(function(){
  function inField(e){
    var el = e.target; if (el && el.nodeType === 3) el = el.parentNode;
    return !!(el && el.closest && el.closest('input, textarea'));
  }
  ['copy', 'cut'].forEach(function(t){
    document.addEventListener(t, function(e){
      if (inField(e)) return;
      e.preventDefault();
      if (e.clipboardData) e.clipboardData.setData('text/plain', '');
    });
  });
  ['contextmenu', 'selectstart', 'dragstart'].forEach(function(t){
    document.addEventListener(t, function(e){ if (!inField(e)) e.preventDefault(); });
  });
  window.print = function(){};
})();
</script>
