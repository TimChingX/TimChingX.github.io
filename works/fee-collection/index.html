<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>物业费收缴手册</title>
<meta name="description" content="程文辉的作品：把《物业费收缴规范与技巧手册》做成可交互的学习网页，10 节微课配图解和小测，闪卡间隔复习，附催费函生成、法条速查和晨会行动清单。">
<meta name="color-scheme" content="light dark">
<meta property="og:type" content="article">
<meta property="og:title" content="物业费收缴 · 互动学习手册">
<meta property="og:description" content="10 节微课、32 张闪卡、41 道情境题，附催费函生成、法条速查和晨会行动清单。">
<meta property="og:image" content="https://timchingx.github.io/works/fee-collection/cover.jpg">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%231B231F'/%3E%3Cpath d='M14 50V30L32 16l18 14v20' fill='none' stroke='%23D6B67C' stroke-width='5' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: sticky ledger header · course map home · 720px reading column with a lesson rail on wide screens */
:root{
  --paper:#F1F4F5; --surface:#FFFFFF; --surface-2:#E7ECEF;
  --ink:#14202A; --ink-2:#4E5D69; --ink-3:#7A8893; --rule:#D5DDE2;
  --accent:#1E4C8A; --accent-ink:#FFFFFF; --accent-soft:#E2EAF5;
  --seal:#BE3A2C; --seal-soft:#F7E3DF; --seal-ink:#FFFFFF;
  --ok:#2C7650; --ok-soft:#DFF0E6;
  --warn:#9A630F; --warn-soft:#FAEFD8;
  --shadow:0 1px 2px rgba(20,32,42,.06),0 6px 20px rgba(20,32,42,.07);
  --f-display:"Noto Serif SC","Noto Serif CJK SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --f-body:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC","Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0D1318; --surface:#151E25; --surface-2:#1D2932;
    --ink:#E3E9ED; --ink-2:#A2B0BA; --ink-3:#71808B; --rule:#283540;
    --accent:#8FB2EC; --accent-ink:#0D1318; --accent-soft:#1A2A42;
    --seal:#EA6B5B; --seal-soft:#3B1F1B; --seal-ink:#1A0D0B;
    --ok:#6CC391; --ok-soft:#14301F;
    --warn:#E3AA4C; --warn-soft:#33270F;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0D1318; --surface:#151E25; --surface-2:#1D2932;
  --ink:#E3E9ED; --ink-2:#A2B0BA; --ink-3:#71808B; --rule:#283540;
  --accent:#8FB2EC; --accent-ink:#0D1318; --accent-soft:#1A2A42;
  --seal:#EA6B5B; --seal-soft:#3B1F1B; --seal-ink:#1A0D0B;
  --ok:#6CC391; --ok-soft:#14301F;
  --warn:#E3AA4C; --warn-soft:#33270F;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
a{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.sm{font-size:13px}
em{font-style:normal}

/* ---------- header ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--rule)}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;height:56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);font-family:var(--f-display);font-weight:900;font-size:18px;letter-spacing:.06em;white-space:nowrap}
.brand svg{width:26px;height:26px;color:var(--seal);flex:none}
.nav{display:flex;gap:2px;margin-left:auto}
.nav a{padding:5px 12px;border-radius:999px;text-decoration:none;color:var(--ink-2);font-size:15px;white-space:nowrap}
.nav a:hover{color:var(--ink)}
.nav a[aria-current="page"]{background:var(--ink);color:var(--paper)}
.prog-t{font-size:13px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{height:3px;background:var(--surface-2)}
.bar i{display:block;height:100%;width:0;background:var(--seal);transition:width .5s ease}
@media (max-width:620px){.prog-t{display:none}.nav a{padding:5px 9px;font-size:14px}.brand{font-size:16px}}
@media (max-width:360px){.brand span{display:none}}

.main{max-width:1180px;margin:0 auto;padding-block:28px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ---------- buttons, tags ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:999px;border:1.5px solid transparent;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:15px;line-height:1.3;text-decoration:none;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule)}
.btn.ghost:hover{border-color:var(--ink-3);filter:none}
.btn.seal{background:var(--seal);color:var(--seal-ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.btn.sm{padding:6px 12px;font-size:13px}
.link{border:0;background:none;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:inherit}
kbd{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:4px;border:1px solid currentColor;opacity:.7}
.tag{display:inline-block;font-size:12px;line-height:1.5;padding:2px 8px;border-radius:4px;background:var(--surface-2);color:var(--ink-2);letter-spacing:.04em;white-space:nowrap;font-weight:600}
.tag.red{background:var(--seal-soft);color:var(--seal)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.blue{background:var(--accent-soft);color:var(--accent)}
.seg{display:inline-flex;flex-wrap:wrap;padding:3px;gap:2px;border-radius:999px;background:var(--surface-2)}
.seg button{border:0;background:none;padding:6px 14px;border-radius:999px;cursor:pointer;color:var(--ink-2);font-size:14px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}

/* ---------- home ---------- */
.hero{position:relative;overflow-x:clip;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px 56px;align-items:center;padding-block:12px 36px;border-bottom:1px solid var(--rule)}
.eyebrow{font-size:13px;letter-spacing:.14em;color:var(--ink-2)}
.hero h1{font-family:var(--f-display);font-weight:900;font-size:clamp(46px,9vw,92px);line-height:1.04;letter-spacing:.04em;margin-top:10px}
.hero h1 small{display:block;font-size:.3em;font-weight:700;letter-spacing:.22em;color:var(--ink-2);margin-top:14px}
.thesis{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:22px;font-size:17px;font-weight:600}
.thesis span{display:inline-flex;align-items:center;gap:8px}
.thesis span::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--seal)}
.hero-cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.hero-meta{margin-top:16px;font-size:13px;color:var(--ink-3)}
.hero-aside{margin:0;display:flex;flex-direction:column;align-items:center;gap:20px;max-width:300px}
.hero-quote{text-align:center}
.hero-quote p{font-family:var(--f-display);font-weight:900;font-size:19px;line-height:1.6;color:var(--ink)}
.hero-quote small{display:block;margin-top:8px;font-size:13px;line-height:1.75;color:var(--ink-2);letter-spacing:.04em}
.seal-big{width:clamp(150px,21vw,232px);height:auto;color:var(--seal);transform:rotate(-9deg)}
.stamp-load{animation:stampLoad .6s cubic-bezier(.2,.9,.3,1.25) .15s both}
@keyframes stampLoad{from{opacity:0;transform:rotate(-9deg) scale(1.5)}to{opacity:1;transform:rotate(-9deg) scale(1)}}
@media (max-width:720px){
  .hero{grid-template-columns:1fr}
  .seal-big{position:absolute;top:2px;right:0;width:92px}
  .eyebrow{padding-right:96px}
  .hero-aside{max-width:none;align-items:stretch}
  .hero-quote{text-align:left;padding-top:16px;border-top:1px solid var(--rule)}
  .hero-quote p{font-size:18px}
}
.today{display:flex;flex-wrap:wrap;gap:8px 28px;align-items:center;margin-top:24px;padding:14px 18px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);font-size:15px}
.today b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.today .gap{flex:1}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:44px 0 14px}
.sec-h h2{font-family:var(--f-display);font-size:26px;font-weight:900}
.sec-h p{color:var(--ink-2);font-size:14px}
.stage{display:grid;grid-template-columns:132px minmax(0,1fr);gap:16px;padding-block:18px;border-top:1px solid var(--rule)}
.stage-l{font-family:var(--f-display);font-weight:900;font-size:20px;line-height:1.4}
.stage-l small{display:block;font-family:var(--f-body);font-weight:400;font-size:13px;color:var(--ink-3);margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;gap:6px;padding:16px 16px 14px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);text-decoration:none;color:var(--ink);transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--accent);transform:translateY(-1px)}
.tile .no{font-family:var(--f-mono);font-size:13px;color:var(--ink-3)}
.tile h3{font-family:var(--f-display);font-size:19px;font-weight:900}
.tile.done h3{padding-right:40px}
.tile p{font-size:14px;color:var(--ink-2);line-height:1.6}
.tile .ft{margin-top:auto;padding-top:8px;display:flex;justify-content:space-between;font-size:13px;color:var(--ink-3)}
.tile .ft .ok{color:var(--seal);font-weight:600}
.tile .stamp{position:absolute;top:8px;right:8px;width:50px;height:50px;color:var(--seal);transform:rotate(12deg);opacity:.92}
@media (max-width:640px){.stage{grid-template-columns:1fr;gap:10px}}
.methods{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.methods div{background:var(--surface);padding:16px 18px}
.methods b{display:block;font-size:16px;margin-bottom:4px}
.methods p{font-size:14px;color:var(--ink-2);line-height:1.65}
@media (max-width:860px){.methods{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.methods{grid-template-columns:1fr}}
.toolrow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.toolrow button{text-align:left;display:flex;flex-direction:column;gap:4px;padding:14px 16px;border:1px solid var(--rule);border-radius:var(--r);background:var(--surface);cursor:pointer}
.toolrow button:hover{border-color:var(--accent)}
.toolrow b{font-size:16px}
.toolrow span{font-size:13px;color:var(--ink-2);line-height:1.55}
@media (max-width:860px){.toolrow{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* ---------- lesson ---------- */
.lwrap{display:grid;grid-template-columns:212px minmax(0,1fr);gap:52px}
.rail{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);align-self:start;display:flex;flex-direction:column;gap:2px;font-size:14px}
.rail-h{font-size:12px;letter-spacing:.12em;color:var(--ink-3);padding:0 10px 6px}
.rail a{display:flex;gap:10px;align-items:center;padding:7px 10px;border-radius:8px;color:var(--ink-2);text-decoration:none}
.rail a:hover{color:var(--ink);background:var(--surface)}
.rail a[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.rail .n{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);width:18px;flex:none}
.rail .d{margin-left:auto;width:8px;height:8px;border-radius:50%;background:var(--seal);flex:none}
@media (max-width:960px){.lwrap{grid-template-columns:1fr}.rail{display:none}}
.lesson{max-width:720px;min-width:0}
.l-head{position:relative;padding-bottom:18px}
.l-head.stamped{padding-right:110px}
.l-eye{font-size:13px;color:var(--ink-3);letter-spacing:.06em}
.l-head h1{font-family:var(--f-display);font-weight:900;font-size:clamp(32px,5vw,46px);line-height:1.2;margin-top:6px}
.l-head .sub{color:var(--ink-2);margin-top:4px}
.l-stamp{position:absolute;top:-6px;right:0;width:100px;height:100px;color:var(--seal);transform:rotate(14deg);opacity:.92}
.stamp-in{animation:stampIn .5s cubic-bezier(.2,.9,.3,1.25) both}
@keyframes stampIn{from{opacity:0;transform:rotate(14deg) scale(1.9)}to{opacity:.92;transform:rotate(14deg) scale(1)}}
@media (max-width:560px){.l-head.stamped{padding-right:76px}.l-stamp{width:72px;height:72px}}
.key{padding:20px 22px;border:1.5px solid var(--ink);border-radius:var(--r);background:var(--surface)}
.key-l{display:block;font-size:12px;letter-spacing:.16em;color:var(--seal);font-weight:700;margin-bottom:6px}
.key p{font-family:var(--f-display);font-size:20px;font-weight:700;line-height:1.65}
.key em{color:var(--seal)}
.sec{display:flex;flex-direction:column;gap:14px;padding-top:34px;scroll-margin-top:72px}
.lesson>.tip{margin-top:14px}
.sec>h2{font-family:var(--f-display);font-size:23px;font-weight:900}
.lead{color:var(--ink-2);font-size:15px;margin-top:-6px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.g2,.g3{grid-template-columns:1fr}}
.box{padding:16px 18px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);display:flex;flex-direction:column;gap:6px;min-width:0}
.box h3{font-size:17px;font-weight:700;line-height:1.5}
.box p{font-size:15px;color:var(--ink-2);line-height:1.7}
.box .ul li{font-size:15px}
.ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.ul li{position:relative;padding-left:18px;line-height:1.7}
.ul li::before{content:"";position:absolute;left:3px;top:.74em;width:6px;height:6px;border-radius:50%;background:var(--ink-3)}
.ol{margin:0;padding:0;list-style:none;counter-reset:o;display:flex;flex-direction:column;gap:8px}
.ol li{counter-increment:o;position:relative;padding-left:34px;line-height:1.7}
.ol li::before{content:counter(o);position:absolute;left:0;top:2px;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ink);font-family:var(--f-mono);font-size:12px;font-weight:600;display:grid;place-items:center;line-height:1}
.tip{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;padding:14px 16px;border-radius:var(--r);background:var(--warn-soft);font-size:15px;line-height:1.75}
.tip-l{font-size:12px;letter-spacing:.08em;color:var(--warn);font-weight:700;white-space:nowrap;padding-top:3px}
.tip.red{background:var(--seal-soft)} .tip.red .tip-l{color:var(--seal)}
.tip.blue{background:var(--accent-soft)} .tip.blue .tip-l{color:var(--accent)}
@media (max-width:480px){.tip{grid-template-columns:1fr}}
.say{margin:0;display:flex;flex-direction:column;gap:12px;padding:16px;background:var(--surface-2);border-radius:var(--r)}
.say figcaption{font-size:12px;letter-spacing:.12em;color:var(--ink-3)}
.bub{max-width:90%;display:flex;flex-direction:column;gap:3px;align-items:flex-start}
.bub.me{align-self:flex-end;align-items:flex-end}
.bub .who{font-size:12px;color:var(--ink-3)}
.bub .who em{color:var(--ink-2)}
.bub p{padding:10px 14px;border-radius:14px;background:var(--surface);line-height:1.65;font-size:15px}
.bub.me p{background:var(--accent);color:var(--accent-ink);border-top-right-radius:4px}
.bub.them p{border-top-left-radius:4px}
.copy{border:0;background:none;color:var(--ink-3);font-size:12px;cursor:pointer;padding:2px 4px}
.copy:hover{color:var(--accent)}
.chain{display:flex;align-items:stretch;gap:6px}
.ch{flex:1 1 0;min-width:0;padding:12px 12px 14px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);display:flex;flex-direction:column;gap:3px}
.ch .i{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.ch b{font-family:var(--f-display);font-size:18px;font-weight:900;line-height:1.4}
.ch span{font-size:13px;color:var(--ink-2);line-height:1.55}
.ch.end{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.ch.end span,.ch.end .i{color:var(--paper);opacity:.75}
.arr{align-self:center;flex:none;color:var(--ink-3);font-size:15px}
@media (max-width:640px){.chain{flex-direction:column}.arr{transform:rotate(90deg)}}
.svgwrap{overflow-x:auto;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:10px}
.svgwrap svg{display:block;width:100%;height:auto;min-width:460px}
.svgwrap text{font-family:var(--f-body)}
.cy-node rect{fill:var(--paper);stroke:var(--rule);stroke-width:1.5}
.cy-node text{fill:var(--ink);font-size:15px;font-weight:600}
.cy-arc{fill:none;stroke:var(--seal);stroke-width:2.2}
.ah{fill:var(--seal)}
.cy-mid{fill:var(--seal);font-family:var(--f-display)!important;font-weight:900;font-size:24px}
.cy-sub{fill:var(--ink-2);font-size:13px}
.wv-area{fill:var(--accent-soft)}
.wv-line{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round}
.wv-l{fill:var(--ink);font-size:14px;font-weight:700}
.wv-base{stroke:var(--rule);stroke-width:1}
.wv-s{fill:var(--ink-3);font-size:12px}
.lm-axis{stroke:var(--ink-3);stroke-width:2}
.lm-arc{fill:none;stroke:var(--ok);stroke-width:2;stroke-dasharray:4 4}
.lm-dot{fill:var(--surface);stroke:var(--ink);stroke-width:2.5}
.lm-dot.w{fill:var(--accent);stroke:var(--accent)}
.lm-dot.s{fill:var(--seal);stroke:var(--seal)}
.lm-t{fill:var(--ink);font-size:13px;font-weight:700}
.lm-m{fill:var(--ink-3);font-size:11px}
.lm-g{fill:var(--ok);font-size:12px;font-weight:700}
.lm-n{fill:var(--ink-2);font-size:12px}
.map{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.map a{display:flex;flex-direction:column;gap:4px;padding:14px;border:1px solid var(--rule);border-radius:var(--r);background:var(--surface);text-decoration:none;color:var(--ink)}
.map a:hover{border-color:var(--accent)}
.map .i{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.map b{font-family:var(--f-display);font-size:17px;font-weight:900}
.map span{font-size:13px;color:var(--ink-2);line-height:1.55}
.map .go{margin-top:auto;padding-top:6px;font-size:12px;color:var(--accent)}

const QMAP={};
function quizBlock(q,id,num){
  QMAP[id]=q;
  const order=shuffle(q.o.map((_,j)=>j));
  return `<div class="q" data-q="${id}"><p class="q-t"><span class="q-n">${num}</span><span>${q.q}</span></p><div class="q-o">${order.map(j=>`<button type="button" class="opt" data-j="${j}">${q.o[j]}</button>`).join('')}</div><p class="q-e" hidden></p></div>`;
}
document.addEventListener('click',e=>{
  const b=e.target.closest('.opt');if(!b||b.disabled)return;
  const box=b.closest('.q');const q=QMAP[box.dataset.q];if(!q)return;
  const j=+b.dataset.j;const ok=j===q.a;
  $$('.opt',box).forEach(o=>{o.disabled=true;if(+o.dataset.j===q.a)o.classList.add('right');else if(o===b)o.classList.add('wrong')});
  const ex=$('.q-e',box);ex.hidden=false;
  ex.innerHTML=(ok?'<b class="ok-t">答对了。</b>':'<b class="bad-t">不对。</b>正确答案已标绿。')+q.e;
  box.dataset.ok=ok?'1':'0';
  box.dispatchEvent(new CustomEvent('answered',{bubbles:true,detail:{ok,q}}));
});

/* ================= COPY ================= */
function copyText(text,btn,srcEl){
  const orig=btn.dataset.orig||btn.textContent;btn.dataset.orig=orig;
  const ok=()=>{btn.textContent='已复制';setTimeout(()=>{btn.textContent=orig},1500)};
  const fail=()=>{try{const r=document.createRange();r.selectNodeContents(srcEl);const s=getSelection();s.removeAllRanges();s.addRange(r)}catch(e){}btn.textContent='已选中，请手动复制';setTimeout(()=>{btn.textContent=orig},2500)};
  try{navigator.clipboard.writeText(text).then(ok,fail)}catch(e){fail()}
}
document.addEventListener('click',e=>{
  const b=e.target.closest('.copy');if(!b)return;
  const p=b.closest('.bub').querySelector('p');copyText(p.textContent,b,p);
});

  if(mq.i>=total){
    const sc=mq.res.filter(Boolean).length;
    const wrong=mq.list.filter((_,k)=>!mq.res[k]);
    const verdict=sc>=9?'可以上岗了。':sc>=7?'基本掌握，错题对应的课再翻一遍。':'建议回到课程，按顺序再学一遍错题相关的课。';
    pb.innerHTML=`<div class="mq"><div class="mq-top"><span>完成</span>${pips}</div><div class="mq-end"><p class="mq-score">${sc}<small> / ${total}</small></p><p><b>${verdict}</b></p>${wrong.length?`<div><p class="muted sm" style="margin-bottom:6px">错题回看：</p>${H.ul(wrong.map(q=>`${q.q} <a href="#${q.l}">第${LMAP[q.l].no}课 ${LMAP[q.l].t}</a>`))}</div>`:''}<div><button type="button" class="btn" id="mq-new">再来一组</button></div></div></div>`;
    $('#mq-new',pb).addEventListener('click',()=>{mq=null;drawMQ(pb)});return;
  }
  const q=mq.list[mq.i];
  pb.innerHTML=`<div class="mq"><div class="mq-top"><span class="mono">第 ${mq.i+1} / ${total} 题</span>${pips}</div><div class="quiz">${quizBlock(q,'mq-'+mq.i+'-'+Date.now(),mq.i+1)}</div><div class="row-btns" id="mq-nx" hidden><button type="button" class="btn" id="mq-next">${mq.i===total-1?'看结果':'下一题'} →</button></div></div>`;
  const qb=$('.q',pb);
  qb.addEventListener('answered',e=>{
    mq.res.push(e.detail.ok);
    $('.q-e',qb).insertAdjacentHTML('afterend',`<p class="q-src">出自 <a href="#${q.l}">第${LMAP[q.l].no}课 ${LMAP[q.l].t}</a></p>`);
    $('#mq-nx',pb).hidden=false;$('#mq-next',pb).focus();
    $$('.pips i',pb)[mq.i].className=e.detail.ok?'ok':'bad';
  });
  $('#mq-next',pb).addEventListener('click',()=>{mq.i++;drawMQ(pb);window.scrollTo({top:0})});
}

function stageOf(m){if(m<=0)return 0;if(m<=1)return 1;if(m<3)return 2;if(m<12)return 3;if(m<18)return 4;if(m<24)return 5;return 6}
function toolCalc(tb){
  tb.innerHTML=`<div class="tool-2col"><div class="panel"><h2>欠费节点计算</h2><div class="calc-in"><label for="calc-m">已欠费</label><input type="number" id="calc-m" min="0" max="120" step="1" value="5" inputmode="numeric"><span>个月</span></div><p class="muted sm">填 0 表示还没到期（应收前）。示例为 5 个月。</p><div id="calc-next"></div></div><div id="calc-card"></div></div>`;
  const inp=$('#calc-m',tb);
  const upd=()=>{
    let m=parseInt(inp.value,10);if(isNaN(m)||m<0)m=0;
    const s=stageOf(m);$('#calc-card',tb).innerHTML=stageCard(s);
    const nx=[3,12,18,24].find(x=>x>m);const act={3:'发放《催缴通知单》',12:'EMS寄送《欠费催缴函》',18:'寄送《催缴律师函》',24:'启动法律程序'};
    let h=nx?`<div class="calc-next">距下一节点 <b>满${nx}个月</b> 还有 <b class="mono">${nx-m}</b> 个月，届时${act[nx]}。</div>`:`<div class="calc-next">已过全部节点，按第10课推进法律程序。</div>`;
    if(m>=3&&m<18)h+=`<p class="sm" style="margin-top:8px">恶意拒缴且已送达2封以上书面催缴仍无效？可以<a href="#l9">申请提前升级</a>。</p>`;
    $('#calc-next',tb).innerHTML=h;
  };
  inp.addEventListener('input',upd);upd();
}
function toolDiag(tb){
  let cur=1;

    const d=DIAG[cur];
    const res=d[1].map(x=>{
      if(x==='r')return `<a class="zcard" style="--tc:var(--warn);text-decoration:none;color:var(--ink)" href="#l7"><span class="cn">↗</span><span><b>角色扮演法（组合打法）</b><span>系统、管家、财务、法务轮番联系，压力逐级上升；管家给台阶。</span></span></a>`;
      if(x==='e')return `<a class="zcard" style="--tc:var(--seal);text-decoration:none;color:var(--ink)" href="#l9"><span class="cn">↗</span><span><b>提前升级 → 法律催收</b><span>恶意欠费≥3个月且≥2封书面催函无效，经审批提前寄律师函或启动法律程序。</span></span></a>`;
      const z=ZHAO[x-1];return `<button type="button" class="zcard" style="--tc:${TIERS[z.tier][1]}" data-goz="${z.n}"><span class="cn">${CN[z.n]}</span><span><b>第${CN[z.n]}招 ${z.name}</b><span>${z.gist}</span></span></button>`;
    }).join('');
    tb.innerHTML=`<div class="tool-2col"><div class="panel"><h2>业主属于哪种情况？</h2><div class="diag" role="group" aria-label="业主情况">${DIAG.map((x,i)=>`<button type="button" data-di="${i}" aria-pressed="${i===cur}">${x[0]}</button>`).join('')}</div></div><div class="panel"><h2>推荐打法</h2><div class="diag-r">${res}</div><p class="muted sm">点招数卡片，跳到第6课看完整要点和话术。</p></div></div>`;
  };
  tb.onclick=e=>{const b=e.target.closest('[data-di]');if(b){cur=+b.dataset.di;draw();return}const z=e.target.closest('[data-goz]');if(z){pendingZhao=+z.dataset.goz;location.hash='l6'}};
  draw();
}
const LF=[['name','业主称呼','王女士'],['room','房号','5栋1203'],['co','物业公司','××物业服务有限公司'],['contract','合同名称','《××花园前期物业服务合同》'],['clause','合同条款','第五条第二款'],['from','欠费起始','2025年3月'],['to','欠费截止','2026年8月'],['months','欠费月数','18'],['fee','物业费（元）','6480'],['late','违约金（元）','320'],['contact','物业联系人','张××'],['tel','联系电话','020-8888 8888'],['app','线上缴费渠道','××小程序']];
function toolLetter(tb){

  const v=k=>{const el=$('#lf-'+k,tb);return el?el.value.trim():''};
  const money=x=>{const n=parseFloat(x);return isNaN(n)?'—':n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})};
  const d=new Date();const date=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
  const build=()=>{
    const total=(parseFloat(v('fee'))||0)+(parseFloat(v('late'))||0);
    return `尊敬的${v('name')}：

您好！

首先，感谢您一直以来对${v('co')}工作的理解与支持！近期我司一直就贵单元（${v('room')}）物业费未缴纳一事与您沟通，现将我司的想法和建议与您作如下交流：

此前沟通中，我司已就您反映的问题积极协调处理，并为您提供了线上缴费、转账、银行代扣等多种缴费方式。截至目前，相关费用仍未结清。根据您签署的${v('contract')}${v('clause')}的约定，作为业主，您有按时缴纳物业费的责任。

作为从事服务工作的企业，我司愿意为业主做更多工作，也非常乐意为您提供力所能及的帮助，同时也希望您能站在客观理性的立场上理解、支持和配合我们的工作。

特此提醒：贵单元自${v('from')}至${v('to')}，已有${v('months')}个月的物业费计${money(v('fee'))}元及违约金计${money(v('late'))}元，共计${money(total)}元未缴纳（明细见附件）。希望您接到此函后尽快结清相关费用，避免产生更多违约金，造成不必要的经济损失。

缴费方式：①物业服务中心现场缴费；②线上缴费（${v('app')}）；③银行转账（户名、账号、开户行见附件，请备注房号、姓名和“物业费”）。

感谢您的理解和支持！我们希望随时与您保持沟通，若您有好的建议，也非常欢迎您提出。

物业联系人：${v('contact')}　联系电话：${v('tel')}

顺颂商祺！

${v('co')}（盖章）
${date}

附件：缴费明细、欠费明细、缴纳方式说明`;
  };
  const out=$('#lf-out',tb);
  const render=()=>{out.innerHTML='<p class="letter-t">物业费催收温馨提示</p>';out.appendChild(document.createTextNode(build()))};
  $('#lf',tb).addEventListener('input',render);
  $('#lf',tb).addEventListener('submit',e=>e.preventDefault());
  $('#lf-copy',tb).addEventListener('click',e=>copyText('物业费催收温馨提示\n\n'+build(),e.currentTarget,out));
  render();
}
function toolLaw(tb){
  let q='',f='全部';
  const chips=['全部',...Object.keys(LAWNAME)];
  tb.innerHTML=`<div class="lawbar"><input type="search" id="law-q" placeholder="搜关键词，如：时效、连带、停水、维修资金" aria-label="搜索法条"><div class="lawchips" role="group" aria-label="按法规筛选">${chips.map(c=>`<button type="button" data-lc="${c}" aria-pressed="${c==='全部'}">${c}</button>`).join('')}</div><p class="muted sm" id="law-n"></p></div><div class="laws" id="law-list" style="margin-top:12px"></div>`;
  const hl=(html,t)=>{if(!t)return html;const et=esc(t);return html.split(/(<[^>]+>)/).map(s=>s.startsWith('<')?s:s.split(et).join(`<mark>${et}</mark>`)).join('')};
  const draw=()=>{
    const t=q.trim();
    const rows=LAWS.filter(r=>(f==='全部'||r[0]===f)&&(!t||(r[1]+r[2].replace(/<[^>]+>/g,'')+LAWNAME[r[0]]).includes(t)));

  };

function onMorningChange(e){

/* ================= ROUTER ================= */
const VIEWS=['home','practice','tools','morning',...LESSONS.map(l=>l.id)];
function route(){
  let v=(location.hash||'').slice(1);if(!VIEWS.includes(v))v='home';
  main.removeEventListener('change',onMorningChange);
  const tab=v.startsWith('l')?'home':v;
  $$('.nav a').forEach(a=>{if(a.dataset.v===tab)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
  if(v==='home'){main.innerHTML=homeHTML()}
  else if(v==='practice'){main.innerHTML=practiceHTML();mountPractice()}
  else if(v==='tools'){main.innerHTML=toolsHTML();mountTools()}
  else if(v==='morning'){main.innerHTML=morningHTML();mountMorning()}
  else{const L=LMAP[v];main.innerHTML=lessonHTML(L);hydrate(main);mountLesson(L)}
  if(v==='l6'&&zFromLink){const z=$('#zhao-sec');zFromLink=false;if(z){z.scrollIntoView({block:'start'});return}}
  window.scrollTo(0,0);
}
let zFromLink=false;
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tool]');
  if(t){e.preventDefault();toolTab=t.dataset.tool;if(location.hash==='#tools')route();else location.hash='tools';return}
  const z=e.target.closest('a[data-z]');
  if(z){pendingZhao=+z.dataset.z;zFromLink=true;if(location.hash==='#l6'){e.preventDefault();route()}}
});
window.addEventListener('hashchange',()=>{if(pendingZhao&&location.hash==='#l6')zFromLink=true;route()});
updProg();route();
})();
