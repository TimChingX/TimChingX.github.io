<style>
/* 2026-10-25：重做配色和排版，功能、数据、加密不变。
   这是一件“产品”而不是“官网”，所以按工具界面的做法来：
   · 纸和墨：页面是燕麦色的桌面，面板、处方笺、函件是叠在上面的象牙色纸；不用纯白、纯黑，不用阴影、渐变、毛玻璃，层次只靠纸色深浅和 1px 细线。
   · 衬线体负责“说话”：页面标题和导语、话术、业主原话、函件、处方笺的诊断，都是工具替客服开口的地方；无衬线体负责“指路”：导航、按钮、表单、表格、标签；等宽体只写日期和数字。
   · 陶土橘一页只给一个最重要的动作（诊断一户、保存到台账、打印函件……），按钮上用墨色字（5.9:1）；陶土橘不写小字、不做装饰。
   · 原来的藏蓝（选中、链接、变量）全部改成墨色；状态色换成和纸同温度的低饱和版本，做文字时在三种纸色上都不低于 4.5:1。
   · 中文正文行高 1.75，话术 1.9；面板圆角 16px，按钮和输入框 8px，导航、标签、徽章直角；今日作战用一块墨色区块收尾，像书的章节分隔。 */
@font-face{font-family:"CJ Serif";src:url(serif-700.woff2) format("woff2");font-weight:600 700;font-display:swap}
@font-face{font-family:"FC Mono";src:url(../../assets/home-mono-500.woff2) format("woff2");font-weight:400 600;font-display:swap}
:root{
  /* 纸 */
  --paper:#F0EEE6;      /* 页面底色：燕麦色的桌面 */
  --surface:#FAF9F5;    /* 面板、处方笺、函件：象牙色的纸 */
  --surface-2:#E8E6DC;  /* 选中、悬停、提示：更深一档的纸 */
  --sunk:#F0EEE6;       /* 纸上的嵌入块：话术、表格行悬停 */
  /* 墨 */
  --ink:#141413;        /* 标题、正文 */
  --ink-2:#3D3D3A;      /* 说明文字（象牙纸上 10.3:1） */
  --ink-3:#5E5D59;      /* 小字、日期、表头（最深的纸上也有 5.3:1） */
  --ink-muted:#B0AEA5;  /* 只做装饰和图表，不写字 */
  --rule:#DEDAD0; --rule-2:#C8C4B8;
  /* 交互：选中、链接、变量一律用墨色，不再用藏蓝 */
  --primary:#141413; --primary-ink:#FAF9F5; --primary-soft:#E8E6DC; --primary-line:#B0AEA5;
  /* 陶土橘：一页只给一个最重要的动作 */
  --clay:#D97757; --clay-deep:#C6613F;
  /* 状态色：与纸同温度的低饱和版本 */
  --red:#9C3A2C; --red-soft:#F5E3DC;
  --amber:#7E5C14; --amber-soft:#F4EAD2; --amber-line:#CDAA62;
  --green:#4F633A; --green-soft:#E6E9DA;
  --sky:#365F88; --sky-line:#6A9BCC; --sky-soft:#E1E8EF;
  --violet:#7B4867; --violet-soft:#EFE2E8;
  --olive:#788C5D;      /* 图表辅助色：预计可回收 */
  --bar:#B0AEA5;        /* 图表里的对照柱 */
  --gA:var(--red); --gB:var(--amber); --gC:var(--green); --gD:var(--sky);
  --shadow:none;
  --serif:"CJ Serif","Noto Serif SC","Noto Serif CJK SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --serif-text:"Noto Serif SC","Noto Serif CJK SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  /* 导语、话术这类衬线正文：没有好看的宋体时（如 Windows 只有中易宋体）退回黑体，小字不发虚 */
  --serif-read:"Noto Serif SC","Noto Serif CJK SC","Source Han Serif SC","Songti SC","STSong","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  --sans:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC","Source Han Sans SC",system-ui,sans-serif;
  --mono:"FC Mono",ui-monospace,"SF Mono",Menlo,Consolas,"PingFang SC","Microsoft YaHei",monospace;
  --r-s:8px; --r-m:16px; --r-l:24px; --g-ink:#FAF9F5;
  color-scheme:light;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.75 var(--sans);letter-spacing:.01em;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--ink-muted);text-decoration-thickness:1px;text-underline-offset:3px}
a:hover{text-decoration-color:var(--ink)}
h1,h2,h3,h4{margin:0;font-weight:700}
p{margin:0}
::placeholder{color:var(--ink-3);opacity:.75}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:3px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== Shell ===== */
.app{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--rule);padding:22px 14px 24px;background:var(--paper)}
.brand{padding:0 10px 18px;border-bottom:1px solid var(--rule);margin-bottom:14px}
.brand b{display:block;font:700 20px/1.3 var(--serif);letter-spacing:.04em;white-space:nowrap}
.nav-g{margin:18px 0 4px;padding:0 10px;font-size:12px;letter-spacing:.16em;color:var(--ink-3)}
/* 导航：直角，选中项是更深一档的纸，左边一道墨线 */
.nav a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:0;color:var(--ink-2);text-decoration:none;position:relative}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{color:var(--ink);font-weight:600;background:var(--surface-2)}
.nav a[aria-current="page"]::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--ink)}
.nav .cnt{margin-left:auto;font:600 12px var(--mono);color:var(--red)}

.main{min-width:0}
.ctx{position:sticky;top:0;z-index:20;background:var(--paper);border-bottom:1px solid var(--rule)}
.ctx-bar{display:flex;align-items:center;gap:10px;padding:10px 40px;min-height:52px;flex-wrap:wrap}
.ctx-bar .lab{font-size:13px;color:var(--ink-3);white-space:nowrap}
.ctx-pills{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.pill{display:inline-flex;gap:5px;align-items:baseline;border:1px solid var(--rule-2);background:var(--surface);border-radius:999px;padding:1px 11px;font-size:13px;white-space:nowrap}
.pill i{font-style:normal;color:var(--ink-3);font-size:12px}
.pill.off{border-style:dashed;color:var(--ink-3);background:transparent}
.ctx-panel{display:none;padding:4px 40px 18px;border-top:1px dashed var(--rule-2)}
.ctx.open .ctx-panel{display:block}
.ctx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 12px}
.ctx-hint{font-size:12px;color:var(--ink-3);margin-top:10px}

.view{padding:40px 40px 96px;max-width:1280px}
/* 页头：衬线大标题，下面一段衬线导语 */
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 24px;flex-wrap:wrap;margin-bottom:28px}
.vh h1{font:700 32px/1.25 var(--serif);letter-spacing:.04em}
.vh p{color:var(--ink-2);margin-top:10px;max-width:42em;font:400 16px/1.8 var(--serif-read)}
.sec{margin-top:52px}
.sec>h2{font:700 22px/1.4 var(--serif);letter-spacing:.04em;margin-bottom:6px}
.sec>.lead{color:var(--ink-2);margin-bottom:18px;max-width:46em;font:400 15.5px/1.8 var(--serif-read)}
h3.t{font-size:16px;font-weight:700;margin-bottom:8px}

/* ===== Controls ===== */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--rule-2);background:var(--surface);color:var(--ink);border-radius:var(--r-s);padding:7px 16px;cursor:pointer;font-size:14px;line-height:1.5;white-space:nowrap;transition:background-color .15s,border-color .15s}
.btn:hover{border-color:var(--ink-3);background:var(--surface-2)}
/* 陶土橘：每页只有这一个按钮，墨色字 */
.btn.pri{background:var(--clay);border-color:var(--clay);color:var(--ink);font-weight:600}
.btn.pri:hover{background:var(--clay-deep);border-color:var(--clay-deep)}
/* 同一屏出现第二个主按钮时（空状态、批量短信、导入、手机上的“看处方笺”），退成墨色，陶土橘只留一个 */
.btn.pri.jump,
.view:has(.empty) .vh .btn.pri,
.view:has([data-act="bulkCopyAll"]) .vh .btn.pri,
.view:has([data-act="impDo"]) .vh .btn.pri{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.btn.pri.jump:hover,
.view:has(.empty) .vh .btn.pri:hover,
.view:has([data-act="bulkCopyAll"]) .vh .btn.pri:hover,
.view:has([data-act="impDo"]) .vh .btn.pri:hover{background:var(--ink-2);border-color:var(--ink-2)}
.btn.sm{padding:3px 11px;font-size:13px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink);text-decoration:underline;text-decoration-color:var(--ink-muted);text-underline-offset:4px}
.btn.ghost:hover{background:var(--surface-2);text-decoration-color:var(--ink)}
.btn.danger{color:var(--red)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field>span{font-size:12.5px;color:var(--ink-2)}
.field>small{font-size:12px;color:var(--ink-3);line-height:1.5}
.inp, .field input, .field select, .field textarea{width:100%;min-width:0;border:1px solid var(--rule-2);background:var(--surface);border-radius:var(--r-s);padding:7px 10px;font-size:14px;line-height:1.5;transition:border-color .15s}
.inp:hover, .field input:hover, .field select:hover, .field textarea:hover{border-color:var(--ink-3)}
.field textarea{resize:vertical;min-height:64px}
.inp:focus, .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 14px}
.span2{grid-column:span 2}

/* 可选项：胶囊；选中后墨底象牙字 */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule-2);background:var(--surface);border-radius:999px;padding:3px 13px;font-size:13.5px;cursor:pointer;line-height:1.6;color:var(--ink-2);transition:background-color .15s,border-color .15s,color .15s}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip .c{opacity:.7;margin-left:4px;font:500 11.5px var(--mono)}
.seg{display:inline-flex;border:1px solid var(--rule-2);border-radius:var(--r-s);overflow:auto;background:var(--surface);max-width:100%}
.seg button{border:0;background:none;padding:6px 14px;cursor:pointer;color:var(--ink-2);font-size:14px;white-space:nowrap;border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button:hover{background:var(--surface-2);color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);font-weight:600}
.check{display:flex;gap:9px;align-items:flex-start;padding:7px 0;cursor:pointer;line-height:1.6}
.check input{margin-top:5px;accent-color:var(--ink);flex:none;width:16px;height:16px}

/* ===== Surfaces ===== */
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-m);padding:20px 22px}
.panel+.panel{margin-top:16px}
.cols2>.panel+.panel,.cols3>.panel+.panel,.grid2>.panel+.panel{margin-top:0}
.panel h3{font-size:15.5px;font-weight:700;margin-bottom:12px}
.note{border-left:2px solid var(--ink-muted);background:var(--surface-2);padding:10px 14px;border-radius:0 var(--r-s) var(--r-s) 0;font-size:14px;color:var(--ink)}
.note.warn{border-color:var(--amber);background:var(--amber-soft)}
.note.bad{border-color:var(--red);background:var(--red-soft)}
.note.ok{border-color:var(--green);background:var(--green-soft)}
.note b{font-weight:700}

/* ledger table：表头下一道墨线，行间 1px 细线 */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-weight:600;font-size:12.5px;color:var(--ink-3);text-align:left;padding:10px 12px;border-bottom:1px solid var(--ink);white-space:nowrap;letter-spacing:.04em}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--rule);vertical-align:top}
.tbl tbody tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--sunk)}
.tbl .r{text-align:right}
.tbl-wrap{overflow:auto;border:1px solid var(--rule);border-radius:var(--r-m);background:var(--surface)}
.tbl-wrap .tbl th:first-child,.tbl-wrap .tbl td:first-child{padding-left:18px}
.tbl-wrap .tbl th:last-child,.tbl-wrap .tbl td:last-child{padding-right:18px}

/* badges：分级是直角的小色块，像印上去的标签 */
.g{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:2px;font:600 12.5px/1 var(--mono);color:var(--g-ink)}
.g.A{background:var(--gA)} .g.B{background:var(--gB)} .g.C{background:var(--gC)} .g.D{background:var(--gD)}
.tag{display:inline-block;font-size:12px;padding:0 7px;border:1px solid transparent;border-radius:0;background:var(--surface-2);color:var(--ink-2);line-height:1.75;white-space:nowrap}
.tag.cause{background:transparent;border-color:var(--rule-2);color:var(--ink)}
.lamp{display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.lamp::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.lamp.ok{color:var(--green)} .lamp.check{color:var(--amber)} .lamp.red{color:var(--red)} .lamp.must{color:var(--violet)} .lamp.over{color:var(--ink-3)}

/* 话术里的变量：已带入的值墨色加粗，下面一道雾蓝细线；没填的是虚线框；要人工填的是黄框 */
.tok{color:var(--ink);font-weight:600;padding:0 1px;text-decoration:underline;text-decoration-color:var(--sky-line);text-decoration-thickness:1.5px;text-underline-offset:4px}
.tok.empty{text-decoration:none;border:1px dashed var(--ink-muted);border-radius:3px;font:400 .86em var(--sans);padding:0 4px;color:var(--ink-3);background:var(--surface-2)}
.tok.man{text-decoration:none;border:1px dashed var(--amber-line);color:var(--amber);border-radius:3px;font:400 .86em var(--sans);padding:0 4px;background:var(--amber-soft)}

/* 话术：工具替客服开口的地方，用衬线体，左边一道墨线 */
.script{border-left:2px solid var(--ink);background:var(--sunk);padding:12px 16px 13px;border-radius:0 var(--r-s) var(--r-s) 0}
.script+.script{margin-top:10px}
.script-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.script-h span{font-size:12.5px;color:var(--ink-3)}
.script p{font:400 16px/1.9 var(--serif-read);color:var(--ink)}
.copy{border:1px solid var(--rule-2);background:var(--surface);border-radius:6px;font-size:12px;padding:0 10px;line-height:1.9;cursor:pointer;color:var(--ink-2);flex:none}
.copy:hover{color:var(--ink);border-color:var(--ink)}

/* question cards：业主原话用衬线体 */
.qlist{display:grid;gap:12px}
.qcard{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-m);padding:16px 20px}
.qcard header{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
.qcard .qid{font:600 12.5px/1 var(--mono);color:var(--ink-3);flex:none;letter-spacing:.04em}
.qcard .qq{font:600 17px/1.5 var(--serif-read)}
.qcard .tags{display:flex;gap:4px;margin-left:auto}
details.more{margin-top:8px}
details.more summary{cursor:pointer;font-size:13px;color:var(--ink-2);list-style:none;display:inline-flex;gap:4px;align-items:center}
details.more summary:hover{color:var(--ink)}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+";display:inline-block;width:14px;font-weight:700;color:var(--ink)}
details.more[open] summary::before{content:"−"}
.kv{display:grid;grid-template-columns:4.5em 1fr;gap:4px 12px;margin-top:8px;font-size:14px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0}

/* moves */
.mv{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-m);overflow:hidden}
.mv+.mv{margin-top:8px}
.mv>summary{display:flex;gap:12px;align-items:center;padding:14px 18px;cursor:pointer;list-style:none;flex-wrap:wrap}
.mv>summary:hover{background:var(--sunk)}
.mv>summary::-webkit-details-marker{display:none}
.mv .n{font:700 15px/1 var(--serif);width:52px;flex:none;color:var(--ink-3)}
.mv .nm{font-weight:700;font-size:16px}
.mv .sb{color:var(--ink-2);font-size:14px}
.mv .fit{margin-left:auto;font-size:12.5px;color:var(--ink-3)}
.mv[open]>summary{border-bottom:1px solid var(--rule)}
.mv-body{padding:16px 20px 20px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.mv-body h4{font-size:12.5px;color:var(--ink-3);font-weight:600;margin-bottom:6px;letter-spacing:.06em}
.mv-body ol, .mv-body ul{margin:0;padding-left:1.3em}
.mv-body li{margin:2px 0}
.cat-h{display:flex;align-items:baseline;gap:10px;margin:30px 0 10px}
.cat-h b{font:700 17px var(--serif)}
.cat-h span{font-size:13px;color:var(--ink-3)}
.meter{display:inline-flex;gap:2px;vertical-align:middle}
.meter i{width:12px;height:6px;border-radius:0;background:var(--rule)}
.meter i.on{background:var(--ink-2)}

/* sequence arrows */
.seq{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.seq .st{border:1px solid var(--rule-2);background:var(--surface);color:var(--ink);border-radius:var(--r-s);padding:2px 10px;font-size:13.5px;white-space:nowrap}
.seq .ar{color:var(--ink-3);font-size:13px}

/* ===== Wizard ===== */
.wiz{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,440px);gap:24px;align-items:start}
.step{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-m);padding:22px 24px}
.step+.step{margin-top:16px}
.step-h{display:flex;align-items:baseline;gap:12px;margin-bottom:14px}
.step-h b{font:700 26px/1 var(--serif);color:var(--ink)}
.step-h h3{font-size:16px;font-weight:700}
.step-h p{font-size:13px;color:var(--ink-3);margin-left:auto}
.sig-g{margin-top:14px}
.sig-g:first-child{margin-top:0}
.sig-g>div:first-child{font-size:12.5px;color:var(--ink-3);margin-bottom:6px}
.scores{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:18px;padding-top:16px;border-top:1px dashed var(--rule-2)}
.sc{display:flex;flex-direction:column;align-items:stretch;gap:4px;text-align:center;border:1px solid transparent;border-radius:var(--r-s);padding:4px 2px 6px;cursor:pointer;background:none}
.sc .bar{height:52px;display:flex;align-items:flex-end;justify-content:center}
.sc .bar i{display:block;width:22px;background:var(--rule-2);border-radius:2px 2px 0 0;min-height:2px;transition:height .25s}
.sc b{font:700 14px var(--serif)}
.sc small{font-size:11.5px;color:var(--ink-3)}
.sc.main{border-color:var(--ink);background:var(--surface-2)}
.sc.main .bar i{background:var(--ink)}
.sc.second .bar i{background:var(--ink-muted)}
.sc:hover{border-color:var(--rule-2)}

/* prescription slip：一张象牙色的纸，上沿是撕口，墨色双线压头，不加阴影 */
.slip-wrap{position:sticky;top:68px;max-height:calc(100vh - 84px);overflow:auto;padding:6px 4px 10px;margin:-6px -4px 0;overscroll-behavior:contain}
.slip{background:var(--surface);color:var(--ink);border:1px solid var(--rule-2);border-radius:2px;position:relative;padding:24px 24px 20px}
.slip::before{content:"";position:absolute;left:10px;right:10px;top:-5px;height:10px;background:radial-gradient(circle at 5px 5px,var(--paper) 3.2px,transparent 3.6px) 0 0/14px 10px repeat-x}
.slip-top{border-bottom:3px double var(--ink);padding-bottom:10px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.slip-top h2{font:700 21px/1.2 var(--serif);letter-spacing:.32em;color:var(--ink)}
.slip-top span{font-size:12px;color:var(--ink-3)}
.slip-id{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;padding:9px 0;border-bottom:1px solid var(--rule)}
.slip-id i{font-style:normal;color:var(--ink-3);margin-right:4px}
.slip-row{display:grid;grid-template-columns:4.6em minmax(0,1fr);gap:10px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:14px;line-height:1.7}
.slip-row:last-child{border-bottom:0}
.slip-row>dt{color:var(--ink-3);font-size:13px;padding-top:1px}
.slip-row>dd{margin:0;min-width:0}
.dx{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dx-main{font:700 32px/1 var(--serif);letter-spacing:.06em}
.dx-sub{font-size:13px;color:var(--ink-2)}
.levers{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.levers span{font-size:12px;border:1px solid var(--rule);border-radius:0;padding:0 6px;color:var(--ink-3)}
.levers span.on{border-color:var(--ink);color:var(--ink);background:var(--surface-2);font-weight:600}
.rp{font:italic 700 26px/1 var(--serif);color:var(--ink);padding:14px 0 4px}
.rx dl{margin:0}
.rx .line{display:grid;grid-template-columns:4.6em minmax(0,1fr);gap:10px;padding:4px 0;font-size:14px}
.rx .line dt{color:var(--ink-3);font-size:13px}
.rx .line dd{margin:0}
.rx .line.bad dd{color:var(--red)}
.slip-foot{margin-top:14px;padding-top:12px;border-top:1px dashed var(--rule-2);text-align:center;font:600 13px var(--serif);letter-spacing:.2em;color:var(--ink-3)}
.slip-empty{padding:36px 6px;text-align:center;color:var(--ink-3);font-size:14px}
.slip-empty b{display:block;font:700 18px var(--serif);color:var(--ink-2);margin-bottom:6px}
.track{position:relative;height:6px;background:var(--surface-2);border-radius:3px;margin:8px 0 4px;overflow:hidden}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.track-l{display:flex;justify-content:space-between;font:500 11.5px/1.6 var(--mono);color:var(--ink-3)}

/* ===== Today ===== */
.brief{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--rule);border-radius:var(--r-m);background:var(--surface)}
.brief>div{padding:18px 22px 16px;border-right:1px solid var(--rule)}
.brief>div:last-child{border-right:0}
.brief b{display:block;font:700 30px/1.2 var(--serif);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.brief span{font-size:13px;color:var(--ink-3)}
.brief .hot b{color:var(--red)}
.cols2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.todo{list-style:none;margin:0;padding:0}
.todo li{display:grid;grid-template-columns:80px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.todo li:last-child{border-bottom:0}
.todo li:hover .who{text-decoration:underline;text-decoration-color:var(--ink-muted);text-underline-offset:4px}
.todo .dt{font:500 12.5px/1.75 var(--mono);color:var(--ink-3);padding-top:1px}
.todo .dt.late{color:var(--red);font-weight:600}
.todo .who{font-weight:600}
.todo .what{font-size:13.5px;color:var(--ink-2)}
.bars{display:grid;gap:10px}
.brow{display:grid;grid-template-columns:3.4em minmax(0,1fr) 4.6em;gap:8px;align-items:center;font-size:13px}
.brow .bx{display:grid;gap:3px}
.brow .bx i{display:block;height:8px;border-radius:0;min-width:2px}
.brow .v{text-align:right;color:var(--ink-3);font:500 11.5px/1.4 var(--mono);font-variant-numeric:tabular-nums}
.bars.wide .brow{grid-template-columns:4.6em minmax(0,1fr) 4.6em}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-3);margin-bottom:12px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:0;margin-right:5px;vertical-align:-1px}
.empty{border:1px dashed var(--rule-2);border-radius:var(--r-l);padding:48px 24px;text-align:center;background:var(--surface)}
.empty h2{font:700 22px var(--serif);margin-bottom:8px}
.empty p{color:var(--ink-2);margin-bottom:20px;font:400 15.5px/1.8 var(--serif-read)}
/* 收缴全景：六个阶段，左上角用等宽体编号 */
.stages{counter-reset:st;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;border:1px solid var(--rule);border-radius:var(--r-m);background:var(--surface);overflow:hidden}
.stages>div{counter-increment:st;padding:16px 16px 18px;border-right:1px solid var(--rule);font-size:13px;position:relative}
.stages>div::before{content:"0" counter(st);display:block;font:500 11.5px/1 var(--mono);letter-spacing:.08em;color:var(--ink-3);margin-bottom:12px}
.stages>div:last-child{border-right:0}
.stages b{display:block;font:700 15px var(--serif);margin-bottom:6px;color:var(--ink)}
.stages p{color:var(--ink-2);line-height:1.6}
.rules5{counter-reset:r;list-style:none;margin:0;padding:0;display:grid;gap:10px}
.rules5 li{counter-increment:r;display:grid;grid-template-columns:28px 1fr;gap:8px;font:400 15.5px/1.8 var(--serif-read)}
.rules5 li::before{content:counter(r);font:500 13px/2.1 var(--mono);color:var(--ink-3)}
/* 浅陶土色区块：今日作战用它收尾，像书的章节分隔（陶土橘约 25% 叠在象牙纸上，墨色字 13.6:1，序号深陶土 4.6:1） */
.sec.ink{background:#F1D9CA;color:var(--ink);border-radius:var(--r-l);padding:40px 44px 44px}
.sec.ink>h2{color:var(--ink);margin-bottom:20px}
.sec.ink .rules5{gap:14px;max-width:46em}
.sec.ink .rules5 li{font-size:17px;line-height:1.75}
.sec.ink .rules5 li::before{color:#9A4A2E;line-height:2}

/* ===== Drawer ===== */
.drawer-bg{position:fixed;inset:0;background:rgba(20,20,19,.28);z-index:40;display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--paper);z-index:41;transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column;border-left:1px solid var(--rule-2)}
.drawer.open{transform:none}
.drawer.open+.drawer-bg, .drawer-bg.open{display:block}
.dr-h{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--rule);background:var(--surface)}
.dr-h h2{font:700 19px var(--serif)}
.dr-h .x{margin-left:auto}
.dr-b{overflow:auto;padding:16px 20px 40px;flex:1}
.dr-b .panel{padding:16px 18px}
.logs{list-style:none;margin:0;padding:0}
.logs li{padding:10px 0;border-bottom:1px solid var(--rule);font-size:14px}
.logs li:last-child{border-bottom:0}
.logs .meta{font-size:12.5px;color:var(--ink-3);display:flex;gap:10px;flex-wrap:wrap}
.logs .int{color:var(--green);font-weight:600}

/* ===== Timeline ===== */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:96px;top:6px;bottom:6px;width:1px;background:var(--rule-2)}
.tl li{display:grid;grid-template-columns:84px 26px minmax(0,1fr);gap:0 0;padding:6px 0 14px;position:relative}
.tl .d{font:500 12px/1.55 var(--mono);color:var(--ink-3);text-align:right;padding-right:10px;font-variant-numeric:tabular-nums}
.tl .dot{width:13px;height:13px;border-radius:50%;border:1.5px solid var(--rule-2);background:var(--surface);margin:4px 0 0 6px;position:relative;z-index:1}
.tl li.done .dot{background:var(--ink-muted);border-color:var(--ink-muted)}
.tl li.now .dot{background:var(--ink);border-color:var(--ink)}
.tl li.lim .dot{background:var(--red);border-color:var(--red)}
.tl .c b{font-weight:700}
.tl li.now .c b{color:var(--ink)}
.tl li.done .c{color:var(--ink-3)}
.tl .c p{font-size:14px}
.tl .c small{display:block;font-size:12.5px;color:var(--ink-3)}
.stars{color:var(--amber);letter-spacing:1px;white-space:nowrap}
.stars i{font-style:normal;color:var(--rule-2)}
.verdict{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.verdict.yes{color:var(--green)} .verdict.mid{color:var(--amber)} .verdict.weak{color:var(--red)}
.scene{display:grid;gap:6px}
.scene button{text-align:left;border:1px solid var(--rule);background:var(--surface);border-radius:var(--r-s);padding:9px 12px;cursor:pointer;font-size:14px}
.scene button:hover{border-color:var(--rule-2)}
.scene button[aria-pressed="true"]{border-color:var(--ink);background:var(--surface-2);box-shadow:inset 3px 0 0 var(--ink)}

/* ===== Calculators ===== */
.calc{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:start}
.res{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-m);padding:20px 22px}
.res-big{display:flex;gap:28px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--rule);margin-bottom:14px}
.res-big div span{display:block;font-size:12.5px;color:var(--ink-3)}
.res-big div b{font:700 26px/1.3 var(--serif);font-variant-numeric:tabular-nums}
.res-big .neg b{color:var(--red)} .res-big .pos b{color:var(--green)}
.spark{width:100%;height:auto;display:block}
.range{width:100%;accent-color:var(--ink)}

/* ===== Red lines：灯是实心圆点，不发光 ===== */
.lights{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.lightcol{border-radius:var(--r-m);border:1px solid var(--rule);background:var(--surface);overflow:hidden}
.lightcol>header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--rule)}
.lightcol>header b{font:700 17px var(--serif)}
.lightcol>header span{font-size:12.5px;color:var(--ink-3)}
.bulb{width:12px;height:12px;border-radius:50%;flex:none}
.lc-red .bulb{background:var(--red)}
.lc-yel .bulb{background:var(--amber)}
.lc-grn .bulb{background:var(--green)}
.lc-red>header{background:var(--red-soft)} .lc-yel>header{background:var(--amber-soft)} .lc-grn>header{background:var(--green-soft)}
.li-item{padding:12px 18px;border-bottom:1px solid var(--rule);font-size:14px}
.li-item:last-child{border-bottom:0}
.li-item b{display:block;font-weight:700;margin-bottom:2px}
.li-item p{color:var(--ink-2);font-size:13.5px}
.li-item .alt{color:var(--green);font-size:13.5px;margin-top:3px}
.li-item mark{background:var(--amber-soft);color:inherit;border-radius:2px;padding:0 1px}
.prog{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden;margin:8px 0 4px}
.prog i{display:block;height:100%;background:var(--ink);transition:width .25s}
.say{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.say>div{border-radius:var(--r-m);padding:14px 18px;font:400 15.5px/1.8 var(--serif-read)}
.say .no{background:var(--red-soft)} .say .yes{background:var(--green-soft)}
.say small{display:block;font:700 12.5px/1.6 var(--sans);margin-bottom:4px}
.say .no small{color:var(--red)} .say .yes small{color:var(--green)}

/* ===== Letters：函件是一张象牙色的纸，正文宋体 ===== */
.letter{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:24px;align-items:start}
.paper{background:var(--surface);color:var(--ink);border:1px solid var(--rule-2);border-radius:2px;padding:48px 56px 52px;font:15.5px/2 var(--serif-text);min-height:640px}
.paper h2{text-align:center;font:700 22px/1.4 var(--serif);letter-spacing:.3em;margin-bottom:24px}
.paper p{text-indent:2em;margin:0 0 4px}
.paper p.ni{text-indent:0}
.paper ul,.paper ol{margin:2px 0 6px;padding-left:4em}
.paper .sign{text-align:right;text-indent:0;margin-top:18px}
.paper .sign+.sign{margin-top:0}
.paper .att{font-size:14px;text-indent:0;margin-top:18px;color:var(--ink-2)}
.paper .fill{border-bottom:1px solid var(--ink);padding:0 2px}
.paper .tok.man, .paper .tok.empty{font-family:var(--sans);font-size:12.5px;background:var(--amber-soft);color:var(--amber);border-color:var(--amber-line)}
.paper table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.6;margin:6px 0}
.paper td,.paper th{border:1px solid var(--ink-3);padding:4px 8px;text-indent:0;text-align:left}
.sticky-top{position:sticky;top:76px}
.form-scroll{display:grid;gap:12px}
.rows-ed{display:grid;gap:10px}
.rows-ed .row{display:grid;grid-template-columns:1.4fr .9fr 1.2fr .9fr auto;gap:6px;align-items:end}

/* ===== Law ===== */
.grip{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-m);padding:18px 20px}
.grip+.grip{margin-top:10px}
.grip header{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.grip header b:first-child{font:700 14px var(--serif);color:var(--ink-3);flex:none}
.grip header .tt{font-weight:700;font-size:16px}
.grip header .ss{color:var(--ink-3);font-size:13.5px}
.grip .law{font-size:14px;color:var(--ink-2);margin-bottom:6px}
.grip .use{font-size:14.5px}
.art{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 16px;padding:12px 0;border-bottom:1px solid var(--rule);font-size:14.5px}
.art:last-child{border-bottom:0}
.art b{font-weight:700}
.art small{display:block;color:var(--ink-3);font-size:12.5px}
mark.hl{background:var(--amber-soft);color:inherit;border-radius:2px}

/* war room bar */
.agenda{display:flex;height:36px;border-radius:var(--r-s);overflow:hidden;border:1px solid var(--rule);margin:8px 0 10px}
.agenda>div{display:flex;align-items:center;justify-content:center;font:600 12px var(--mono);color:var(--g-ink);border-right:1px solid rgba(250,249,245,.5);white-space:nowrap;overflow:hidden}
.agenda>div:last-child{border-right:0}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--surface);padding:8px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:all .2s;z-index:60}
.toast.on{opacity:1;transform:translateX(-50%)}

.m-nav{display:none}
.jump{display:none}

/* ===== Responsive ===== */
@media (max-width:1180px){
  .wiz{grid-template-columns:minmax(0,1fr)}
  .slip-wrap{position:static;max-height:none;overflow:visible;margin:0;padding:0}
  .jump{display:inline-flex;position:fixed;right:16px;bottom:20px;z-index:30;border-radius:999px;padding:8px 18px}
  .stages{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stages>div:nth-child(3){border-right:0}
  .stages>div:nth-child(-n+3){border-bottom:1px solid var(--rule)}
}
@media (max-width:980px){
  .calc,.letter{grid-template-columns:minmax(0,1fr)}
  .sticky-top{position:static}
  .lights{grid-template-columns:minmax(0,1fr)}
  .cols3{grid-template-columns:minmax(0,1fr)}
  .mv-body{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .m-nav{display:block;position:sticky;top:0;z-index:25;background:var(--paper);border-bottom:1px solid var(--rule)}
  .m-top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 4px}
  .m-top b{font:700 18px var(--serif);letter-spacing:.06em}
  .m-tabs{display:flex;gap:2px;overflow-x:auto;padding:4px 10px 8px;scrollbar-width:none}
  .m-tabs::-webkit-scrollbar{display:none}
  .m-tabs a{flex:none;padding:4px 12px;border-radius:999px;text-decoration:none;color:var(--ink-2);font-size:14px}
  .m-tabs a[aria-current="page"]{background:var(--ink);color:var(--surface);font-weight:600}
  .ctx{position:static}
  .ctx-pills{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .ctx-pills::-webkit-scrollbar{display:none}
  .ctx-bar .lab{display:none}
  .step-h{flex-wrap:wrap}
  .step-h p{margin-left:0;width:100%}
  .ctx-bar{padding:8px 16px}
  .ctx-panel{padding:4px 16px 14px}
  .view{padding:24px 16px 80px}
  .vh{margin-bottom:22px}
  .vh h1{font-size:26px}
  .vh p{font-size:15px}
  .sec{margin-top:40px}
  .sec>h2{font-size:20px}
  .panel,.step{padding:18px 16px}
  .cols2{grid-template-columns:minmax(0,1fr)}
  .brief{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brief>div{padding:14px 16px}
  .brief b{font-size:24px}
  .brief>div:nth-child(2){border-right:0}
  .brief>div:nth-child(-n+2){border-bottom:1px solid var(--rule)}
  .grid3,.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stages{grid-template-columns:minmax(0,1fr)}
  .stages>div{border-right:0;border-bottom:1px solid var(--rule)}
  .stages>div:last-child{border-bottom:0}
  .sec.ink{padding:28px 20px 30px;border-radius:var(--r-m)}
  .sec.ink .rules5 li{font-size:16px}
  .scores{grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
  .sc .bar i{width:14px}
  .paper{padding:28px 20px 32px;font-size:14.5px;min-height:0}
  .art{grid-template-columns:minmax(0,1fr)}
  .say{grid-template-columns:minmax(0,1fr)}
  .rows-ed .row{grid-template-columns:1fr 1fr}
  /* ledger table → cards */
  .tbl.stack thead{display:none}
  .tbl.stack, .tbl.stack tbody, .tbl.stack tr, .tbl.stack td{display:block;width:100%}
  .tbl.stack tr{padding:12px 16px;border-bottom:1px solid var(--rule)}
  .tbl.stack tr:last-child{border-bottom:0}
  .tbl.stack td{border:0;padding:2px 0 !important;display:flex;justify-content:space-between;gap:12px;text-align:right}
  .tbl.stack td::before{content:attr(data-l);color:var(--ink-3);font-size:12.5px;text-align:left;flex:none}
  .tbl.stack td.r{text-align:right}
  .tl::before{left:72px}
  .tl li{grid-template-columns:62px 22px minmax(0,1fr)}
  .tl .dot{margin-left:4px}
}
@media (max-width:520px){
  .grid2,.grid3,.grid4{grid-template-columns:minmax(0,1fr)}
  .span2{grid-column:auto}
  .slip{padding:20px 14px 16px}
  .dx-main{font-size:26px}
  .kv{grid-template-columns:minmax(0,1fr)}
  .kv dt{margin-top:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

/* ===== v2 additions ===== */
.lamp.now{color:var(--ink)}
.g.N{background:var(--surface-2);color:var(--ink-2)}
.pay{color:var(--green);font-weight:600}
.tbl tr.muted td{color:var(--ink-3)}
.search-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:1px solid var(--rule-2);background:var(--surface);border-radius:var(--r-s);padding:7px 10px;color:var(--ink-3);font-size:13.5px;cursor:pointer;text-align:left;margin-bottom:4px}
.search-btn:hover{border-color:var(--ink-3);color:var(--ink-2)}
.search-btn kbd{font:500 12px var(--mono);border:1px solid var(--rule-2);border-radius:3px;padding:0 6px;color:var(--ink-3);background:var(--paper)}
.m-top .btn-row{gap:6px;flex-wrap:nowrap}
.ctx-pick{width:auto;max-width:200px;padding:3px 8px;font-size:13px}
.sk-bg{position:fixed;inset:0;background:rgba(20,20,19,.32);z-index:50;display:none}
.sk-bg.open{display:block}
.sk{position:fixed;left:50%;top:6vh;transform:translateX(-50%);width:min(760px,calc(100% - 24px));max-height:86vh;display:none;flex-direction:column;background:var(--paper);border:1px solid var(--rule-2);border-radius:var(--r-m);z-index:51;overflow:hidden}
.sk.open{display:flex}
.sk-h{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--rule);background:var(--surface)}
.sk-h input{flex:1;min-width:0;border:0;background:transparent;font-size:17px;padding:6px 2px}
.sk-h input:focus{outline:none}
.sk-b{overflow:auto;padding:4px 18px 20px}
.sk-g{margin-top:14px}
.sk-g>h4{font-size:12.5px;color:var(--ink-3);font-weight:600;padding-bottom:4px;border-bottom:1px solid var(--ink);letter-spacing:.04em}
.sk-i{padding:10px 0;border-bottom:1px dashed var(--rule-2)}
.sk-i:last-child{border-bottom:0}
.sk-i>b{display:block;margin-bottom:6px}
.sk-rec{display:flex;gap:10px;align-items:center;flex-wrap:wrap;width:100%;text-align:left;background:none;border:0;padding:8px 6px;border-radius:var(--r-s);cursor:pointer}
.sk-rec:hover{background:var(--surface-2)}
.bulk-row{display:grid;grid-template-columns:8em minmax(0,1fr) auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid var(--rule)}
.bulk-row p{font:400 15px/1.85 var(--serif-read)}
.bulk-row .btn-row{gap:6px;flex-wrap:nowrap}
.copy:disabled{opacity:.55;cursor:default}
.plist{font:13px/1.55 var(--sans);color:#111;background:#fff}
.plist h2{font:700 20px/1.4 var(--serif);margin-bottom:2px}
.plist h3{font-size:14px;font-weight:700;margin:14px 0 6px}
.plist table{width:100%;border-collapse:collapse;font-size:12px}
.plist th,.plist td{border:1px solid #999;padding:3px 5px;text-align:left;vertical-align:top}
.plist th{background:#f0f0f0}
#printRoot{display:none}
@media (max-width:860px){
  .bulk-row{grid-template-columns:minmax(0,1fr);gap:6px}
  .ctx-pick{max-width:118px}
  .sk{top:0;width:100%;max-height:100%;height:100%;border-radius:0;border:0}
}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff !important}
  body.printing>*:not(#printRoot){display:none !important}
  body.printing #printRoot{display:block}
  #printRoot .paper,#printRoot .slip{background:#fff !important;color:#000 !important;border:0 !important;padding:0 !important;min-height:0 !important}
  #printRoot .slip::before{display:none}
  #printRoot .copy,#printRoot .no-print{display:none !important}
  #printRoot .tok.man,#printRoot .tok.empty{background:none;border:0;border-bottom:1px solid #333;color:#000}
  #printRoot .script,#printRoot tr{break-inside:avoid}
}
</style>
<style>/* 返回主页按钮：位置、形状与央玺花园一致；按精读“不用毛玻璃、不用阴影”，改成象牙色实底加 1px 细线 */
.pf-back{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:16px;z-index:35;display:inline-flex;align-items:center;gap:7px;
  min-height:36px;padding:8px 14px 8px 10px;border-radius:999px;font:500 13px/1.2 var(--sans);letter-spacing:0;color:var(--ink);text-decoration:none;white-space:nowrap;
  background:var(--surface);border:1px solid var(--rule-2);transition:background-color .2s}

/* 电脑：侧栏加宽一点、顶部留出按钮的位置 */
@media (min-width:861px){.app{grid-template-columns:232px minmax(0,1fr)}}
.side{padding-top:calc(68px + env(safe-area-inset-top,0px))}
/* 手机：顶栏第一行左边是按钮，右边是搜索；原来的标题和“主页”按钮去掉 */
@media (max-width:860px){

}
/* 窄屏手机：搜索改成图标按钮，给左上角的按钮让位 */

}

</style>

<body>
<pf-gate></pf-gate>
<div class="pf-lock" role="alert"><p class="pf-lock-t">本作品仅支持在线浏览</p><p class="pf-lock-s">另存或转载的副本无法打开，请访问在线版本</p><a href="https://timchingx.github.io/works/fee-collection/">前往在线版本 →</a></div>
<a class="pf-back" href="../../"><svg viewBox="0 0 12 12" aria-hidden="true"><path d="M7.5 2 3.5 6l4 4"/></svg>返回主页</a>
<div class="app">
  <aside class="side" aria-label="主导航">
    <div class="brand"><b>物业费收缴助手</b></div>
    <button class="search-btn" type="button" data-act="skOpen"><span>搜索话术、法条</span><kbd>/</kbd></button>
    <nav class="nav" id="nav"></nav>
  </aside>
  <div class="main">
    <div class="m-nav">
      <div class="m-top"><b>物业费收缴助手</b><div class="btn-row"><button class="btn sm" type="button" data-act="skOpen">搜索</button></div></div>
      <nav class="m-tabs" id="mtabs" aria-label="主导航"></nav>
    </div>
    <div class="ctx" id="ctx">
      <div class="ctx-bar">
        <span class="lab">当前业主</span>
        <div class="ctx-pills" id="ctxPills"></div>
        <button class="btn sm" type="button" id="ctxToggle" aria-expanded="false" aria-controls="ctxPanel">填写变量</button>
        <button class="btn sm ghost" type="button" id="ctxClear">清空</button>
      </div>
      <div class="ctx-panel" id="ctxPanel">
        <div class="ctx-grid" id="ctxGrid"></div>
        <p class="ctx-hint">填一次，话术库、处方笺和函件里的同名变量都会自动带入。数据只保存在本机浏览器。</p>
      </div>
    </div>
    <main class="view" id="view"></main>
  </div>
</div>
<aside class="drawer" id="drawer" aria-hidden="true" aria-label="欠费户详情"></aside>
<div class="drawer-bg" id="drawerBg"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<input type="file" id="impFile" accept=".csv,.txt,text/csv" hidden>
<div class="sk-bg" id="skBg"></div>
<div class="sk" id="sk" role="dialog" aria-modal="true" aria-label="搜索"><div class="sk-h"><input id="skInput" type="search" placeholder="搜业主原话、话术、法条、红线、房号" autocomplete="off"><button class="btn sm" type="button" data-act="skClose">关闭</button></div><div class="sk-b" id="skOut"></div></div>
<div id="printRoot"></div>
<script>(function(){ var c = window.__cj; window.__cj = null; if (c) new Function(c)(); })();</script>
<script>/* 整份作品禁止复制：拦截复制、剪切、右键菜单、选中与拖拽（输入框除外）；禁止打印 */
(function(){
  function inField(e){ var el = e.target; if (el && el.nodeType === 3) el = el.parentNode; return !!(el && el.closest && el.closest('input, textarea, select')); }
  ['copy', 'cut'].forEach(function(t){ document.addEventListener(t, function(e){ if (inField(e)) return; e.preventDefault(); if (e.clipboardData) e.clipboardData.setData('text/plain', ''); }); });
  ['contextmenu', 'selectstart', 'dragstart'].forEach(function(t){ document.addEventListener(t, function(e){ if (!inField(e)) e.preventDefault(); }); });
  window.print = function(){};
})();
</script>
<script defer src="https://events.vercount.one/js"></script>
</body>
</html>
