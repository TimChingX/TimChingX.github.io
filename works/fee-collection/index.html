.home-link{display:inline-flex;align-items:center;gap:6px;margin:0 0 14px 10px;font-size:13px;color:var(--ink-2);text-decoration:none}

<style>
@font-face{font-family:"CJ Serif";src:url(serif-700.woff2) format("woff2");font-weight:600 700;font-display:swap}
:root{
  --paper:#F2F4F1; --surface:#FFFFFF; --surface-2:#E8ECE7; --sunk:#EDF0EC;
  --ink:#1C2830; --ink-2:#47555D; --ink-3:#77858B; --rule:#D3DAD3; --rule-2:#BCC5BD;
  --primary:#23418E; --primary-ink:#FFFFFF; --primary-soft:#E2E8F6; --primary-line:#9FB0DA;
  --red:#B5382C; --red-soft:#F6E2DF; --amber:#9C6B06; --amber-soft:#F6EBCF; --amber-line:#D9B25A;
  --green:#2B7448; --green-soft:#DDEFE3; --violet:#6B3FA0; --violet-soft:#ECE3F6;
  --gA:#B5382C; --gB:#9C6B06; --gC:#2B7448; --gD:#23418E;
  --shadow:0 1px 0 rgba(28,40,48,.04), 0 6px 18px -10px rgba(28,40,48,.25);
  --serif:"CJ Serif","Noto Serif SC","Noto Serif CJK SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --serif-text:"Noto Serif SC","Noto Serif CJK SC","Source Han Serif SC","Songti SC","STSong","SimSun",serif;
  --sans:"PingFang SC","HarmonyOS Sans SC","Microsoft YaHei","Noto Sans SC","Noto Sans CJK SC","Source Han Sans SC",system-ui,sans-serif;
  --r-s:4px; --r-m:8px; --g-ink:#FFFFFF;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#141A1E; --surface:#1B2328; --surface-2:#242E34; --sunk:#182025;
    --ink:#E3E8EA; --ink-2:#B3BEC3; --ink-3:#86939A; --rule:#2F3A40; --rule-2:#415058;
    --primary:#8FA8EE; --primary-ink:#0F1A33; --primary-soft:#22305A; --primary-line:#4A5F99;
    --red:#EE8A7E; --red-soft:#4A2522; --amber:#E2B657; --amber-soft:#43361A; --amber-line:#8A6B25;
    --green:#7CCB97; --green-soft:#1E3A29; --violet:#C3A3EC; --violet-soft:#33264A;
    --gA:#EE8A7E; --gB:#E2B657; --gC:#7CCB97; --gD:#8FA8EE; --g-ink:#10161A;
    --shadow:0 1px 0 rgba(0,0,0,.2), 0 8px 22px -12px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#141A1E; --surface:#1B2328; --surface-2:#242E34; --sunk:#182025;
  --ink:#E3E8EA; --ink-2:#B3BEC3; --ink-3:#86939A; --rule:#2F3A40; --rule-2:#415058;
  --primary:#8FA8EE; --primary-ink:#0F1A33; --primary-soft:#22305A; --primary-line:#4A5F99;
  --red:#EE8A7E; --red-soft:#4A2522; --amber:#E2B657; --amber-soft:#43361A; --amber-line:#8A6B25;
  --green:#7CCB97; --green-soft:#1E3A29; --violet:#C3A3EC; --violet-soft:#33264A;
  --gA:#EE8A7E; --gB:#E2B657; --gC:#7CCB97; --gD:#8FA8EE; --g-ink:#10161A;
  --shadow:0 1px 0 rgba(0,0,0,.2), 0 8px 22px -12px rgba(0,0,0,.6);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.7 var(--sans);letter-spacing:.01em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
h1,h2,h3,h4{margin:0;font-weight:700}
p{margin:0}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:3px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ===== Shell ===== */
.app{display:grid;grid-template-columns:212px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;border-right:1px solid var(--rule);padding:22px 14px 24px;background:var(--paper)}
.brand{padding:0 10px 18px;border-bottom:1px solid var(--rule);margin-bottom:12px}
.brand b{display:block;font:700 22px/1.25 var(--serif);letter-spacing:.06em}
.brand span{display:block;font-size:12px;color:var(--ink-3);margin-top:4px}
.nav-g{margin:14px 0 4px;padding:0 10px;font-size:12px;color:var(--ink-3)}
.nav a{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--r-s);color:var(--ink-2);text-decoration:none;position:relative}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{color:var(--primary);font-weight:700;background:var(--primary-soft)}
.nav a[aria-current="page"]::before{content:"";position:absolute;left:-14px;top:6px;bottom:6px;width:3px;background:var(--primary);border-radius:0 2px 2px 0}
.nav .cnt{margin-left:auto;font-size:12px;font-weight:600;color:var(--red)}
.side-foot{margin-top:22px;padding:12px 10px 0;border-top:1px solid var(--rule);font-size:12px;color:var(--ink-3);line-height:1.6}
.theme-btn{margin-top:10px;background:none;border:1px solid var(--rule-2);border-radius:var(--r-s);padding:3px 10px;font-size:12px;color:var(--ink-2);cursor:pointer}

.main{min-width:0}
.ctx{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule)}
.ctx-bar{display:flex;align-items:center;gap:10px;padding:10px 28px;min-height:52px;flex-wrap:wrap}
.ctx-bar .lab{font-size:13px;color:var(--ink-3);white-space:nowrap}
.ctx-pills{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0}
.pill{display:inline-flex;gap:5px;align-items:baseline;border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:1px 10px;font-size:13px;white-space:nowrap}
.pill i{font-style:normal;color:var(--ink-3);font-size:12px}
.pill.off{border-style:dashed;color:var(--ink-3);background:transparent}
.ctx-panel{display:none;padding:4px 28px 16px;border-top:1px dashed var(--rule)}
.ctx.open .ctx-panel{display:block}
.ctx-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 12px}
.ctx-hint{font-size:12px;color:var(--ink-3);margin-top:8px}

.view{padding:26px 28px 80px;max-width:1240px}
.vh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.vh h1{font:700 26px/1.3 var(--serif);letter-spacing:.04em}
.vh p{color:var(--ink-2);margin-top:4px;max-width:46em}
.sec{margin-top:30px}
.sec>h2{font:700 19px/1.4 var(--serif);letter-spacing:.03em;margin-bottom:4px}
.sec>.lead{color:var(--ink-2);margin-bottom:14px;max-width:48em}
h3.t{font-size:16px;font-weight:700;margin-bottom:8px}

/* ===== Controls ===== */
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--rule-2);background:var(--surface);color:var(--ink);border-radius:var(--r-s);padding:6px 14px;cursor:pointer;font-size:14px;line-height:1.5;white-space:nowrap}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--primary);border-color:var(--primary);color:var(--primary-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:2px 10px;font-size:13px}
.btn.ghost{background:transparent;border-color:transparent;color:var(--primary)}
.btn.ghost:hover{background:var(--primary-soft)}
.btn.danger{color:var(--red)}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field>span{font-size:12.5px;color:var(--ink-2)}
.field>small{font-size:12px;color:var(--ink-3);line-height:1.5}
.inp, .field input, .field select, .field textarea{width:100%;min-width:0;border:1px solid var(--rule-2);background:var(--surface);border-radius:var(--r-s);padding:6px 9px;font-size:14px;line-height:1.5}
.field textarea{resize:vertical;min-height:64px}
.inp:focus, .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 14px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 14px}
.span2{grid-column:span 2}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule-2);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:13.5px;cursor:pointer;line-height:1.55;color:var(--ink-2)}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-ink)}
.chip .c{opacity:.7;margin-left:4px;font-size:12px}
.seg{display:inline-flex;border:1px solid var(--rule-2);border-radius:var(--r-s);overflow:auto;background:var(--surface);max-width:100%}
.seg button{border:0;background:none;padding:6px 14px;cursor:pointer;color:var(--ink-2);font-size:14px;white-space:nowrap;border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:600}
.check{display:flex;gap:9px;align-items:flex-start;padding:7px 0;cursor:pointer;line-height:1.55}
.check input{margin-top:4px;accent-color:var(--primary);flex:none;width:16px;height:16px}

/* ===== Surfaces ===== */
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-m);padding:18px 20px}
.panel+.panel{margin-top:14px}
.cols2>.panel+.panel,.cols3>.panel+.panel,.grid2>.panel+.panel{margin-top:0}
.panel h3{font-size:15.5px;font-weight:700;margin-bottom:10px}
.note{border-left:3px solid var(--primary-line);background:var(--primary-soft);padding:9px 14px;border-radius:0 var(--r-s) var(--r-s) 0;font-size:14px;color:var(--ink)}
.note.warn{border-color:var(--amber-line);background:var(--amber-soft)}
.note.bad{border-color:var(--red);background:var(--red-soft)}
.note.ok{border-color:var(--green);background:var(--green-soft)}
.note b{font-weight:700}

/* ledger table */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-weight:600;font-size:12.5px;color:var(--ink-3);text-align:left;padding:8px 10px;border-bottom:1.5px solid var(--ink-3);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--sunk)}
.tbl .r{text-align:right}
.tbl-wrap{overflow:auto;border:1px solid var(--rule);border-radius:var(--r-m);background:var(--surface)}
.tbl-wrap .tbl th:first-child,.tbl-wrap .tbl td:first-child{padding-left:16px}

/* badges */
.g{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 6px;border-radius:var(--r-s);font-weight:700;font-size:12.5px;color:var(--g-ink);line-height:1}
.g.A{background:var(--gA)} .g.B{background:var(--gB)} .g.C{background:var(--gC)} .g.D{background:var(--gD)}
.tag{display:inline-block;font-size:12px;padding:0 7px;border-radius:var(--r-s);background:var(--surface-2);color:var(--ink-2);line-height:1.75;white-space:nowrap}
.tag.cause{background:var(--primary-soft);color:var(--primary)}
.lamp{display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap}
.lamp::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor;flex:none}
.lamp.ok{color:var(--green)} .lamp.check{color:var(--amber)} .lamp.red{color:var(--red)} .lamp.must{color:var(--violet)} .lamp.over{color:var(--ink-3)}

/* tokens in scripts */
.tok{border-bottom:1.5px solid var(--primary);color:var(--primary);font-weight:600;padding:0 1px}
.tok.empty{border:1px dashed var(--primary-line);border-radius:3px;font-weight:400;font-size:.9em;padding:0 4px;background:var(--primary-soft)}
.tok.man{border:1px dashed var(--amber-line);color:var(--amber);border-radius:3px;font-weight:400;font-size:.9em;padding:0 4px;background:var(--amber-soft)}

.script{border-left:3px solid var(--primary);background:var(--sunk);padding:10px 14px 11px;border-radius:0 var(--r-s) var(--r-s) 0}
.script+.script{margin-top:10px}
.script-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:3px}
.script-h span{font-size:12.5px;color:var(--ink-3)}
.script p{font-size:15px;line-height:1.85}
.copy{border:1px solid var(--rule-2);background:var(--surface);border-radius:var(--r-s);font-size:12px;padding:0 9px;line-height:1.9;cursor:pointer;color:var(--ink-2);flex:none}
.copy:hover{color:var(--primary);border-color:var(--primary)}

/* question cards */
.qlist{display:grid;gap:12px}
.qcard{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-m);padding:14px 18px}
.qcard header{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.qcard .qid{font:700 14px/1 var(--serif);color:var(--primary);flex:none}
.qcard .qq{font-weight:700;font-size:16px}
.qcard .tags{display:flex;gap:4px;margin-left:auto}
details.more{margin-top:8px}
details.more summary{cursor:pointer;font-size:13px;color:var(--ink-2);list-style:none;display:inline-flex;gap:4px;align-items:center}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"+";display:inline-block;width:14px;font-weight:700;color:var(--primary)}
details.more[open] summary::before{content:"−"}
.kv{display:grid;grid-template-columns:4.5em 1fr;gap:4px 12px;margin-top:8px;font-size:14px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0}

/* moves */
.mv{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-m)}
.mv+.mv{margin-top:8px}
.mv>summary{display:flex;gap:12px;align-items:center;padding:12px 16px;cursor:pointer;list-style:none;flex-wrap:wrap}
.mv>summary::-webkit-details-marker{display:none}
.mv .n{font:700 15px/1 var(--serif);width:52px;flex:none;color:var(--primary)}
.mv .nm{font-weight:700;font-size:16px}
.mv .sb{color:var(--ink-2);font-size:14px}
.mv .fit{margin-left:auto;font-size:12.5px;color:var(--ink-3)}
.mv[open]>summary{border-bottom:1px solid var(--rule)}
.mv-body{padding:14px 18px 18px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}
.mv-body h4{font-size:13px;color:var(--ink-3);font-weight:600;margin-bottom:6px}
.mv-body ol, .mv-body ul{margin:0;padding-left:1.3em}
.mv-body li{margin:2px 0}
.cat-h{display:flex;align-items:baseline;gap:10px;margin:22px 0 8px}
.cat-h b{font:700 16px var(--serif)}
.cat-h span{font-size:13px;color:var(--ink-3)}
.meter{display:inline-flex;gap:2px;vertical-align:middle}
.meter i{width:12px;height:6px;border-radius:1px;background:var(--rule)}
.meter i.on{background:var(--ink-2)}

/* sequence arrows */
.seq{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.seq .st{border:1px solid var(--primary-line);background:var(--surface);color:var(--primary);border-radius:var(--r-s);padding:2px 9px;font-size:13.5px;white-space:nowrap}
.seq .ar{color:var(--ink-3);font-size:13px}

/* ===== Wizard ===== */
.wiz{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,440px);gap:22px;align-items:start}
.step{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-m);padding:18px 20px}
.step+.step{margin-top:14px}
.step-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.step-h b{font:700 22px/1 var(--serif);color:var(--primary)}
.step-h h3{font-size:16px;font-weight:700}
.step-h p{font-size:13px;color:var(--ink-3);margin-left:auto}
.sig-g{margin-top:12px}
.sig-g:first-child{margin-top:0}
.sig-g>div:first-child{font-size:12.5px;color:var(--ink-3);margin-bottom:6px}
.scores{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:16px;padding-top:14px;border-top:1px dashed var(--rule)}
.sc{display:flex;flex-direction:column;align-items:stretch;gap:4px;text-align:center;border:1px solid transparent;border-radius:var(--r-s);padding:4px 2px 6px;cursor:pointer;background:none}
.sc .bar{height:52px;display:flex;align-items:flex-end;justify-content:center}
.sc .bar i{display:block;width:22px;background:var(--rule-2);border-radius:2px 2px 0 0;min-height:2px;transition:height .25s}
.sc b{font:700 14px var(--serif)}
.sc small{font-size:11.5px;color:var(--ink-3)}
.sc.main{border-color:var(--primary);background:var(--primary-soft)}
.sc.main .bar i{background:var(--primary)}
.sc.second .bar i{background:var(--primary-line)}
.sc:hover{border-color:var(--rule-2)}

/* prescription slip */
.slip-wrap{position:sticky;top:68px;max-height:calc(100vh - 84px);overflow:auto;padding:6px 4px 10px;margin:-6px -4px 0;overscroll-behavior:contain}
.slip{background:var(--surface);color:var(--ink);border:1px solid var(--rule-2);border-radius:2px;box-shadow:var(--shadow);position:relative;padding:22px 22px 18px}
.slip::before{content:"";position:absolute;left:10px;right:10px;top:-5px;height:10px;background:radial-gradient(circle at 5px 5px,var(--paper) 3.2px,transparent 3.6px) 0 0/14px 10px repeat-x}
.slip-top{border-bottom:3px double var(--primary);padding-bottom:10px;display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.slip-top h2{font:700 21px/1.2 var(--serif);letter-spacing:.32em;color:var(--primary)}
.slip-top span{font-size:12px;color:var(--ink-3)}
.slip-id{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:13px;padding:9px 0;border-bottom:1px solid var(--rule)}
.slip-id i{font-style:normal;color:var(--ink-3);margin-right:4px}
.slip-row{display:grid;grid-template-columns:4.6em minmax(0,1fr);gap:10px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:14px;line-height:1.65}
.slip-row:last-child{border-bottom:0}
.slip-row>dt{color:var(--ink-3);font-size:13px;padding-top:1px}
.slip-row>dd{margin:0;min-width:0}
.dx{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dx-main{font:700 30px/1 var(--serif);letter-spacing:.06em}
.dx-sub{font-size:13px;color:var(--ink-2)}
.levers{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.levers span{font-size:12px;border:1px solid var(--rule);border-radius:3px;padding:0 6px;color:var(--ink-3)}
.levers span.on{border-color:var(--primary);color:var(--primary);background:var(--primary-soft);font-weight:600}
.rp{font:italic 700 24px/1 var(--serif);color:var(--primary);padding:12px 0 2px}
.rx dl{margin:0}
.rx .line{display:grid;grid-template-columns:4.6em minmax(0,1fr);gap:10px;padding:4px 0;font-size:14px}
.rx .line dt{color:var(--ink-3);font-size:13px}
.rx .line dd{margin:0}
.rx .line.bad dd{color:var(--red)}
.slip-foot{margin-top:12px;padding-top:10px;border-top:1px dashed var(--rule-2);text-align:center;font:600 13px var(--serif);letter-spacing:.2em;color:var(--ink-3)}
.slip-empty{padding:32px 6px;text-align:center;color:var(--ink-3);font-size:14px}
.slip-empty b{display:block;font:700 18px var(--serif);color:var(--ink-2);margin-bottom:6px}
.track{position:relative;height:8px;background:var(--surface-2);border-radius:4px;margin:8px 0 4px;overflow:hidden}
.track i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.track-l{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3)}

/* ===== Today ===== */
.brief{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--rule);border-radius:var(--r-m);background:var(--surface)}
.brief>div{padding:14px 18px;border-right:1px solid var(--rule)}
.brief>div:last-child{border-right:0}
.brief b{display:block;font:700 24px/1.2 var(--serif);font-variant-numeric:tabular-nums}
.brief span{font-size:13px;color:var(--ink-3)}
.brief .hot b{color:var(--red)}
.cols2{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.todo{list-style:none;margin:0;padding:0}
.todo li{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:10px;align-items:start;padding:9px 0;border-bottom:1px solid var(--rule);cursor:pointer}
.todo li:last-child{border-bottom:0}
.todo li:hover .who{color:var(--primary)}
.todo .dt{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--ink-2);padding-top:1px}
.todo .dt.late{color:var(--red);font-weight:700}
.todo .who{font-weight:600}
.todo .what{font-size:13.5px;color:var(--ink-2)}
.bars{display:grid;gap:9px}
.brow{display:grid;grid-template-columns:3.4em minmax(0,1fr) 4.6em;gap:8px;align-items:center;font-size:13px}
.brow .bx{display:grid;gap:3px}
.brow .bx i{display:block;height:9px;border-radius:2px;min-width:2px}
.brow .v{text-align:right;color:var(--ink-2);font-variant-numeric:tabular-nums;font-size:12px;line-height:1.35}
.bars.wide .brow{grid-template-columns:4.6em minmax(0,1fr) 4.6em}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink-3);margin-bottom:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.empty{border:1.5px dashed var(--rule-2);border-radius:var(--r-m);padding:36px 24px;text-align:center}
.empty h2{font:700 20px var(--serif);margin-bottom:6px}
.empty p{color:var(--ink-2);margin-bottom:16px}
.stages{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;border:1px solid var(--rule);border-radius:var(--r-m);background:var(--surface);overflow:hidden}
.stages>div{padding:12px 14px;border-right:1px solid var(--rule);font-size:13px;position:relative}
.stages>div:last-child{border-right:0}
.stages b{display:block;font:700 14px var(--serif);margin-bottom:4px;color:var(--primary)}
.stages p{color:var(--ink-2);line-height:1.55}
.rules5{counter-reset:r;list-style:none;margin:0;padding:0;display:grid;gap:8px}
.rules5 li{counter-increment:r;display:grid;grid-template-columns:28px 1fr;gap:6px;font-size:14.5px}
.rules5 li::before{content:counter(r);font:700 16px var(--serif);color:var(--primary)}

/* ===== Drawer ===== */
.drawer-bg{position:fixed;inset:0;background:rgba(15,22,27,.35);z-index:40;display:none}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--paper);z-index:41;transform:translateX(102%);transition:transform .22s ease;display:flex;flex-direction:column;border-left:1px solid var(--rule);box-shadow:-12px 0 30px -18px rgba(0,0,0,.4)}
.drawer.open{transform:none}
.drawer.open+.drawer-bg, .drawer-bg.open{display:block}
.dr-h{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--rule);background:var(--surface)}
.dr-h h2{font:700 19px var(--serif)}
.dr-h .x{margin-left:auto}
.dr-b{overflow:auto;padding:16px 20px 40px;flex:1}
.dr-b .panel{padding:14px 16px}
.logs{list-style:none;margin:0;padding:0}
.logs li{padding:9px 0;border-bottom:1px solid var(--rule);font-size:14px}
.logs li:last-child{border-bottom:0}
.logs .meta{font-size:12.5px;color:var(--ink-3);display:flex;gap:10px;flex-wrap:wrap}
.logs .int{color:var(--green);font-weight:600}

/* ===== Timeline ===== */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl::before{content:"";position:absolute;left:96px;top:6px;bottom:6px;width:2px;background:var(--rule)}
.tl li{display:grid;grid-template-columns:84px 26px minmax(0,1fr);gap:0 0;padding:6px 0 14px;position:relative}
.tl .d{font-size:12.5px;color:var(--ink-3);text-align:right;padding-right:10px;font-variant-numeric:tabular-nums;line-height:1.45}
.tl .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--rule-2);background:var(--paper);margin:3px 0 0 6px;position:relative;z-index:1}
.tl li.done .dot{background:var(--ink-3);border-color:var(--ink-3)}
.tl li.now .dot{background:var(--primary);border-color:var(--primary);box-shadow:0 0 0 4px var(--primary-soft)}
.tl li.lim .dot{background:var(--red);border-color:var(--red)}
.tl .c b{font-weight:700}
.tl li.now .c b{color:var(--primary)}
.tl li.done .c{color:var(--ink-3)}
.tl .c p{font-size:14px}
.tl .c small{display:block;font-size:12.5px;color:var(--ink-3)}
.stars{color:var(--amber);letter-spacing:1px;white-space:nowrap}
.stars i{font-style:normal;color:var(--rule-2)}
.verdict{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.verdict.yes{color:var(--green)} .verdict.mid{color:var(--amber)} .verdict.weak{color:var(--red)}
.scene{display:grid;gap:6px}
.scene button{text-align:left;border:1px solid var(--rule);background:var(--surface);border-radius:var(--r-s);padding:8px 12px;cursor:pointer;font-size:14px}
.scene button[aria-pressed="true"]{border-color:var(--primary);box-shadow:inset 3px 0 0 var(--primary)}

/* ===== Calculators ===== */
.calc{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:start}
.res{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-m);padding:18px 20px}
.res-big{display:flex;gap:28px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--rule);margin-bottom:12px}
.res-big div span{display:block;font-size:12.5px;color:var(--ink-3)}
.res-big div b{font:700 24px/1.3 var(--serif);font-variant-numeric:tabular-nums}
.res-big .neg b{color:var(--red)} .res-big .pos b{color:var(--green)}
.spark{width:100%;height:auto;display:block}
.range{width:100%;accent-color:var(--primary)}

/* ===== Red lines ===== */
.lights{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.lightcol{border-radius:var(--r-m);border:1px solid var(--rule);background:var(--surface);overflow:hidden}
.lightcol>header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--rule)}
.lightcol>header b{font:700 17px var(--serif)}
.lightcol>header span{font-size:12.5px;color:var(--ink-3)}
.bulb{width:16px;height:16px;border-radius:50%;flex:none}
.lc-red .bulb{background:var(--red);box-shadow:0 0 0 4px var(--red-soft)}
.lc-yel .bulb{background:var(--amber);box-shadow:0 0 0 4px var(--amber-soft)}
.lc-grn .bulb{background:var(--green);box-shadow:0 0 0 4px var(--green-soft)}
.lc-red>header{background:var(--red-soft)} .lc-yel>header{background:var(--amber-soft)} .lc-grn>header{background:var(--green-soft)}
.li-item{padding:11px 16px;border-bottom:1px solid var(--rule);font-size:14px}
.li-item:last-child{border-bottom:0}
.li-item b{display:block;font-weight:700;margin-bottom:2px}
.li-item p{color:var(--ink-2);font-size:13.5px}
.li-item .alt{color:var(--green);font-size:13.5px;margin-top:3px}
.li-item mark{background:var(--amber-soft);color:inherit;border-radius:2px;padding:0 1px}
.prog{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin:6px 0 2px}
.prog i{display:block;height:100%;background:var(--primary);transition:width .25s}
.say{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.say>div{border-radius:var(--r-m);padding:12px 16px;font-size:14.5px}
.say .no{background:var(--red-soft)} .say .yes{background:var(--green-soft)}
.say small{display:block;font-size:12.5px;font-weight:700;margin-bottom:4px}
.say .no small{color:var(--red)} .say .yes small{color:var(--green)}

/* ===== Letters ===== */
.letter{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:20px;align-items:start}
.paper{background:#FFFFFF;color:#1A1A1A;border:1px solid var(--rule-2);box-shadow:var(--shadow);padding:44px 52px 48px;font:15.5px/2 var(--serif-text);min-height:640px}
.paper h2{text-align:center;font:700 22px/1.4 var(--serif);letter-spacing:.3em;margin-bottom:22px}
.paper p{text-indent:2em;margin:0 0 4px}
.paper p.ni{text-indent:0}
.paper ul,.paper ol{margin:2px 0 6px;padding-left:4em}
.paper .sign{text-align:right;text-indent:0;margin-top:18px}
.paper .sign+.sign{margin-top:0}
.paper .att{font-size:14px;text-indent:0;margin-top:18px;color:#444}
.paper .fill{border-bottom:1px solid #333;padding:0 2px}
.paper .tok.man, .paper .tok.empty{font-family:var(--sans);font-size:12.5px;background:#FFF6DD;color:#8A5A00;border-color:#D9B25A}
.paper table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.6;margin:6px 0}
.paper td,.paper th{border:1px solid #888;padding:4px 8px;text-indent:0;text-align:left}
.sticky-top{position:sticky;top:76px}
.form-scroll{display:grid;gap:12px}
.rows-ed{display:grid;gap:10px}
.rows-ed .row{display:grid;grid-template-columns:1.4fr .9fr 1.2fr .9fr auto;gap:6px;align-items:end}

/* ===== Law ===== */
.grip{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r-m);padding:16px 18px}
.grip+.grip{margin-top:10px}
.grip header{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.grip header b:first-child{font:700 14px var(--serif);color:var(--primary);flex:none}
.grip header .tt{font-weight:700;font-size:16px}
.grip header .ss{color:var(--ink-3);font-size:13.5px}
.grip .law{font-size:14px;color:var(--ink-2);margin-bottom:6px}
.grip .use{font-size:14.5px}
.art{display:grid;grid-template-columns:150px minmax(0,1fr);gap:4px 16px;padding:11px 0;border-bottom:1px solid var(--rule);font-size:14.5px}
.art:last-child{border-bottom:0}
.art b{font-weight:700}
.art small{display:block;color:var(--ink-3);font-size:12.5px}
mark.hl{background:var(--amber-soft);color:inherit;border-radius:2px}

/* war room bar */
.agenda{display:flex;height:36px;border-radius:var(--r-s);overflow:hidden;border:1px solid var(--rule);margin:8px 0 10px}
.agenda>div{display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--g-ink);font-weight:600;border-right:1px solid rgba(255,255,255,.4);white-space:nowrap;overflow:hidden}
.agenda>div:last-child{border-right:0}

.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--paper);padding:8px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:all .2s;z-index:60}
.toast.on{opacity:1;transform:translateX(-50%)}

.m-nav{display:none}
.jump{display:none}

/* ===== Responsive ===== */
@media (max-width:1180px){
  .wiz{grid-template-columns:minmax(0,1fr)}
  .slip-wrap{position:static;max-height:none;overflow:visible;margin:0;padding:0}
  .jump{display:inline-flex;position:fixed;right:16px;bottom:20px;z-index:30;box-shadow:var(--shadow);border-radius:999px;padding:8px 18px}
  .stages{grid-template-columns:repeat(3,minmax(0,1fr))}
  .stages>div:nth-child(3){border-right:0}
  .stages>div:nth-child(-n+3){border-bottom:1px solid var(--rule)}
}
@media (max-width:980px){
  .calc,.letter{grid-template-columns:minmax(0,1fr)}
  .sticky-top{position:static}
  .lights{grid-template-columns:minmax(0,1fr)}
  .cols3{grid-template-columns:minmax(0,1fr)}
  .mv-body{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:860px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .m-nav{display:block;position:sticky;top:0;z-index:25;background:var(--paper);border-bottom:1px solid var(--rule)}
  .m-top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 4px}
  .m-top b{font:700 18px var(--serif);letter-spacing:.06em}
  .m-tabs{display:flex;gap:2px;overflow-x:auto;padding:4px 10px 8px;scrollbar-width:none}
  .m-tabs::-webkit-scrollbar{display:none}
  .m-tabs a{flex:none;padding:4px 11px;border-radius:999px;text-decoration:none;color:var(--ink-2);font-size:14px}
  .m-tabs a[aria-current="page"]{background:var(--ink);color:var(--paper);font-weight:600}
  .ctx{position:static}
  .ctx-pills{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .ctx-pills::-webkit-scrollbar{display:none}
  .ctx-bar .lab{display:none}
  .step-h{flex-wrap:wrap}
  .step-h p{margin-left:0;width:100%}
  .ctx-bar{padding:8px 16px}
  .ctx-panel{padding:4px 16px 14px}
  .view{padding:20px 16px 72px}
  .vh h1{font-size:22px}
  .cols2{grid-template-columns:minmax(0,1fr)}
  .brief{grid-template-columns:repeat(2,minmax(0,1fr))}
  .brief>div:nth-child(2){border-right:0}
  .brief>div:nth-child(-n+2){border-bottom:1px solid var(--rule)}
  .grid3,.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stages{grid-template-columns:minmax(0,1fr)}
  .stages>div{border-right:0;border-bottom:1px solid var(--rule)}
  .scores{grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
  .sc .bar i{width:14px}
  .paper{padding:26px 20px 30px;font-size:14.5px;min-height:0}
  .art{grid-template-columns:minmax(0,1fr)}
  .say{grid-template-columns:minmax(0,1fr)}
  .rows-ed .row{grid-template-columns:1fr 1fr}
  /* ledger table → cards */
  .tbl.stack thead{display:none}
  .tbl.stack, .tbl.stack tbody, .tbl.stack tr, .tbl.stack td{display:block;width:100%}
  .tbl.stack tr{padding:10px 14px;border-bottom:1px solid var(--rule)}
  .tbl.stack td{border:0;padding:2px 0 !important;display:flex;justify-content:space-between;gap:12px;text-align:right}
  .tbl.stack td::before{content:attr(data-l);color:var(--ink-3);font-size:12.5px;text-align:left;flex:none}
  .tbl.stack td.r{text-align:right}
  .tl::before{left:72px}
  .tl li{grid-template-columns:62px 22px minmax(0,1fr)}
  .tl .dot{margin-left:4px}
}
@media (max-width:520px){
  .grid2,.grid3,.grid4{grid-template-columns:minmax(0,1fr)}
  .span2{grid-column:auto}
  .slip{padding:18px 14px 14px}
  .dx-main{font-size:26px}
  .kv{grid-template-columns:minmax(0,1fr)}
  .kv dt{margin-top:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}

/* ===== v2 additions ===== */
.lamp.now{color:var(--primary)}
.g.N{background:var(--surface-2);color:var(--ink-2)}
.pay{color:var(--green);font-weight:600}
.tbl tr.muted td{color:var(--ink-3)}
.search-btn{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:1px solid var(--rule-2);background:var(--surface);border-radius:var(--r-s);padding:6px 10px;color:var(--ink-3);font-size:13.5px;cursor:pointer;text-align:left;margin-bottom:4px}
.search-btn:hover{border-color:var(--ink-3);color:var(--ink-2)}
.search-btn kbd{font:600 12px var(--sans);border:1px solid var(--rule-2);border-radius:3px;padding:0 6px;color:var(--ink-3);background:var(--paper)}
.m-top .btn-row{gap:6px;flex-wrap:nowrap}
.m-top .theme-btn{margin-top:0}
.ctx-pick{width:auto;max-width:200px;padding:3px 8px;font-size:13px}
.sk-bg{position:fixed;inset:0;background:rgba(15,22,27,.45);z-index:50;display:none}
.sk-bg.open{display:block}
.sk{position:fixed;left:50%;top:6vh;transform:translateX(-50%);width:min(760px,calc(100% - 24px));max-height:86vh;display:none;flex-direction:column;background:var(--paper);border:1px solid var(--rule-2);border-radius:var(--r-m);box-shadow:0 24px 60px -20px rgba(0,0,0,.55);z-index:51;overflow:hidden}
.sk.open{display:flex}
.sk-h{display:flex;gap:10px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--rule);background:var(--surface)}
.sk-h input{flex:1;min-width:0;border:0;background:transparent;font-size:17px;padding:6px 2px}
.sk-h input:focus{outline:none}
.sk-b{overflow:auto;padding:4px 18px 20px}
.sk-g{margin-top:14px}
.sk-g>h4{font-size:12.5px;color:var(--ink-3);font-weight:600;padding-bottom:4px;border-bottom:1px solid var(--rule)}
.sk-i{padding:10px 0;border-bottom:1px dashed var(--rule)}
.sk-i:last-child{border-bottom:0}
.sk-i>b{display:block;margin-bottom:6px}
.sk-rec{display:flex;gap:10px;align-items:center;flex-wrap:wrap;width:100%;text-align:left;background:none;border:0;padding:8px 6px;border-radius:var(--r-s);cursor:pointer}
.sk-rec:hover{background:var(--surface-2)}
.bulk-row{display:grid;grid-template-columns:8em minmax(0,1fr) auto;gap:12px;align-items:start;padding:10px 0;border-bottom:1px solid var(--rule)}
.bulk-row p{font-size:14.5px;line-height:1.8}
.bulk-row .btn-row{gap:6px;flex-wrap:nowrap}
.copy:disabled{opacity:.55;cursor:default}
.plist{font:13px/1.55 var(--sans);color:#111;background:#fff}
.plist h2{font:700 20px/1.4 var(--serif);margin-bottom:2px}
.plist h3{font-size:14px;font-weight:700;margin:14px 0 6px}
.plist table{width:100%;border-collapse:collapse;font-size:12px}
.plist th,.plist td{border:1px solid #999;padding:3px 5px;text-align:left;vertical-align:top}
.plist th{background:#f0f0f0}
#printRoot{display:none}
@media (max-width:860px){
  .bulk-row{grid-template-columns:minmax(0,1fr);gap:6px}
  .ctx-pick{max-width:118px}
  .sk{top:0;width:100%;max-height:100%;height:100%;border-radius:0;border:0}
}
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff !important}
  body.printing>*:not(#printRoot){display:none !important}
  body.printing #printRoot{display:block}
  #printRoot .paper,#printRoot .slip{box-shadow:none !important;border:0 !important;padding:0 !important;min-height:0 !important}
  #printRoot .slip::before{display:none}
  #printRoot .copy,#printRoot .no-print{display:none !important}
  #printRoot .tok.man,#printRoot .tok.empty{background:none;border:0;border-bottom:1px solid #333;color:#000}
  #printRoot .script,#printRoot tr{break-inside:avoid}
}

<script>/* 整份作品禁止复制：拦截复制、剪切、右键菜单、选中与拖拽（输入框除外）；禁止打印 */
(function(){
  function inField(e){ var el = e.target; if (el && el.nodeType === 3) el = el.parentNode; return !!(el && el.closest && el.closest('input, textarea, select')); }
  ['copy', 'cut'].forEach(function(t){ document.addEventListener(t, function(e){ if (inField(e)) return; e.preventDefault(); if (e.clipboardData) e.clipboardData.setData('text/plain', ''); }); });
  ['contextmenu', 'selectstart', 'dragstart'].forEach(function(t){ document.addEventListener(t, function(e){ if (!inField(e)) e.preventDefault(); }); });
  window.print = function(){};
})();
</script>
