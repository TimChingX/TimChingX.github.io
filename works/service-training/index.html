<style>/* 禁止选中、拖拽和打印（输入框和生成的卡片图片除外，图片要能长按保存） */
html{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

input,textarea,select{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
.imgout img{-webkit-touch-callout:default}
@media print{
  @page{size:A4;margin:20mm}
  html,body{background:#fff !important}
  body > *{display:none !important}
  body::before{content:"本作品仅供在线浏览，不提供打印或导出。";display:block;padding-top:40mm;text-align:center;font-size:16pt;color:#333}
}

<style>
:root{
  color-scheme: light;
  --paper:#FAF9F5; --sand:#F0EEE6; --stone:#E8E6DC; --pebble:#B0AEA5;
  --ink:#141413; --ink2:#46443F; --ink3:#6E6C66;
  --clay:#D97757; --clay-ink:#B4542F; --clay-soft:#F6E5DC;
  --sky:#6A9BCC; --sky-ink:#3F6E9C; --sky-soft:#E3EDF6;
  --sage:#788C5D; --sage-ink:#55693D; --sage-soft:#E8EEDF;
  --brick:#B23A2E; --brick-soft:#F6E0DC;
  --mustard:#E2B13C; --night:#2B2A27;
  --cn:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC","Source Han Sans SC","Noto Sans SC",system-ui,-apple-system,"Segoe UI",sans-serif;
  --num:Charter,"Bitstream Charter","Iowan Old Style",Cambria,"Noto Serif",Georgia,serif;
}
*{box-sizing:border-box}
html{background:var(--paper);-webkit-text-size-adjust:100%;scroll-behavior:smooth;scroll-padding-top:96px}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.7 var(--cn);overflow-x:hidden;-webkit-font-smoothing:antialiased}
svg{display:block;max-width:100%}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
a{color:var(--clay-ink)}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:8px}
.num{font-family:var(--num);font-variant-numeric:lining-nums tabular-nums}
.wrap{width:100%;max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-9999px}
.skip:focus{left:12px;top:12px;z-index:99;background:#fff;padding:8px 12px}
[hidden]{display:none!important}
p,.lv-hook,.sec-sub,.stage-tip,.fb-title,.fb-note,.fb-voice,.hero-sub,.quick-q,.exam-q,.gc-q{text-wrap:pretty}
.hero-title,.lv-title,.sec-title{text-wrap:balance}
@media (max-width:420px){.stage{padding:16px 12px 14px}.desk{padding:3px}.stairs{padding:3px}}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:40;background:rgba(250,249,245,.93);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--stone)}
.bar{display:flex;align-items:center;gap:10px;height:54px}
.brand{font-weight:800;font-size:15px;white-space:nowrap;letter-spacing:.02em;text-decoration:none;color:var(--ink)}
.meter{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
.meter-label{font-size:13px;color:var(--ink3);white-space:nowrap}
.meter-bar{flex:1;height:8px;border-radius:99px;background:var(--stone);overflow:hidden;min-width:40px}
.meter-fill{height:100%;width:0;background:var(--clay);border-radius:inherit;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.meter-pct{font-size:16px;min-width:2.8em;text-align:right}
.icon-btn{flex:none;width:40px;height:40px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink)}
.icon-btn:hover{background:var(--sand)}
.icon-btn svg{width:22px;height:22px}
#soundBtn[aria-pressed="false"] .on{display:none}
#soundBtn[aria-pressed="true"] .off{display:none}
@media (max-width:370px){.meter-label{display:none}}
/* progress rail under the bar: one segment per level, fills as you scroll through it, ✓ when the level is cleared */
.rail{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;padding-bottom:8px}
.rail a{position:relative;display:block;min-width:0;padding-top:1px;text-decoration:none;color:var(--ink3);-webkit-tap-highlight-color:transparent}
.rail .rbar{display:block;height:4px;border-radius:9px;background:var(--stone);overflow:hidden}
.rail .rbar b{display:block;height:100%;width:0;background:var(--clay);border-radius:inherit;transition:width .15s linear}
.rail .rl{display:block;margin-top:5px;font-size:11.5px;line-height:1.25;white-space:nowrap;overflow:hidden;text-align:left}
.rail .rtime{display:block;font-family:var(--num);letter-spacing:-.01em}
.rail .rname{display:none;overflow:hidden;text-overflow:ellipsis;font-size:12px}
/* ✓ badge sits on the right end of the segment, so it never takes room from the label */
.rail .ck{position:absolute;right:-2px;top:-5px;display:none;width:14px;height:14px;border-radius:50%;background:var(--sage);color:#fff;
  font:800 9px/14px var(--cn);text-align:center;font-style:normal;box-shadow:0 0 0 2px var(--paper)}
.rail a.done{color:var(--sage-ink)}
.rail a.done .ck{display:block}
.rail a.done .rbar b{width:100%!important;background:var(--sage)}
.rail a[aria-current]{color:var(--ink);font-weight:800}
.rail a[aria-current].done{color:var(--sage-ink)}
.rail a:focus-visible{outline:2px solid var(--sky);outline-offset:2px;border-radius:4px}
@media (min-width:700px){.rail .rname{display:block}.rail{padding-bottom:9px}html{scroll-padding-top:112px}}
@media (max-width:359px){.bar a.icon-btn{display:none}.brand{font-size:14px}}

/* ---------- hero ---------- */
.hero{padding-top:18px;padding-bottom:8px}
.screen{position:relative;border-radius:22px;overflow:hidden;border:2px solid var(--ink);background:#EFE8DB;aspect-ratio:3/2}
@media (min-width:640px){.screen{aspect-ratio:16/9}}
.scene{position:absolute;left:0;top:0;width:100%;height:100%}
.screen .yawn{display:block}.screen .smile{display:none}
.screen.happy .yawn{display:none}.screen.happy .smile{display:block}
.screen-top{position:absolute;left:10px;right:10px;top:10px;display:flex;align-items:center;gap:8px;font-size:12.5px;z-index:3}
.live{background:var(--clay-ink);color:#fff;font-weight:700;padding:2px 9px;border-radius:99px;font-size:12px}
.room{font-weight:700;color:var(--ink);background:rgba(250,249,245,.8);padding:2px 8px;border-radius:99px}
.viewers{margin-left:auto;color:var(--ink2);background:rgba(250,249,245,.8);padding:2px 8px;border-radius:99px;font-size:13px}
.dm-layer{position:absolute;left:0;right:0;top:40px;bottom:54px;overflow:hidden;pointer-events:none;z-index:2}
.dm{position:absolute;left:0;top:0;white-space:nowrap;font-size:14px;line-height:1;padding:7px 12px;border-radius:99px;background:rgba(255,255,255,.95);border:1px solid rgba(20,20,19,.14);color:var(--ink);box-shadow:0 3px 10px -6px rgba(20,20,19,.45);will-change:transform;animation-name:dmfly;animation-timing-function:linear;animation-fill-mode:forwards}
.dm.good{background:#F1F5EA;border-color:rgba(85,105,61,.4);color:var(--sage-ink)}
.dm.good::before{content:"赞 ";font-weight:800}
.dm.static{animation:none;position:absolute}
@keyframes dmfly{from{transform:translateX(var(--from))}to{transform:translateX(var(--to))}}
.screen-bottom{position:absolute;left:10px;right:10px;bottom:10px;display:flex;align-items:center;gap:8px;z-index:3;background:rgba(250,249,245,.92);border:1px solid rgba(20,20,19,.12);border-radius:99px;padding:5px 12px;font-size:12.5px;color:var(--ink2)}
.sb-bar{flex:1;height:7px;background:var(--stone);border-radius:99px;overflow:hidden}
.sb-bar i{display:block;height:100%;width:0;background:var(--clay);transition:width .9s cubic-bezier(.2,.8,.2,1)}
.screen-bottom .num{font-size:14px;color:var(--ink);min-width:2.6em;text-align:right}
.hero-title{margin:26px 0 10px;font-size:clamp(32px,8.6vw,52px);line-height:1.18;font-weight:800;letter-spacing:.01em}
.hero-sub{margin:0 0 20px;font-size:18px;color:var(--ink2);max-width:30em}
.hero-cta{display:flex;flex-wrap:wrap;gap:10px}
.hero-meta{margin:16px 0 0;font-size:13.5px;color:var(--ink3)}
/* wide screens: text on the left, the livestream screen on the right, filling the first screen */
@media (min-width:1100px){
  .hero{max-width:1180px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);grid-template-rows:1fr auto auto auto auto 1fr;
    column-gap:56px;min-height:calc(100vh - 100px);padding-top:28px;padding-bottom:44px}
  .hero .screen{grid-column:2;grid-row:1 / -1;align-self:center}
  .hero-title{grid-column:1;grid-row:2;margin-top:0}
  .hero-sub{grid-column:1;grid-row:3}
  .hero-cta{grid-column:1;grid-row:4}
  .hero-meta{grid-column:1;grid-row:5}
}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;border:1.5px solid var(--ink);background:transparent;font-weight:700;font-size:16px;text-decoration:none;color:var(--ink);transition:transform .1s,background .2s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--clay-ink);border-color:var(--clay-ink);color:#fff}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.small{min-height:38px;padding:0 14px;font-size:14.5px}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* ---------- route ---------- */
.sec{padding-top:48px}
.sec-title{margin:0 0 6px;font-size:26px;font-weight:800}
.sec-sub{margin:0 0 18px;color:var(--ink2)}
.route-list{list-style:none;margin:0;padding:0;position:relative}
.route-list::before{content:"";position:absolute;left:66px;top:14px;bottom:14px;width:2px;background:var(--stone)}
.route-list a{position:relative;display:grid;grid-template-columns:58px 18px 1fr auto;align-items:center;column-gap:10px;padding:10px 4px;text-decoration:none;color:var(--ink);border-radius:14px}
.route-list a:hover{background:var(--sand)}
.rt{font-size:17px;color:var(--ink3);text-align:right}
.rd{width:14px;height:14px;border-radius:50%;background:var(--paper);border:2px solid var(--pebble);justify-self:center;z-index:1}
.rn{font-weight:700;font-size:17px;line-height:1.35}
.rn small{display:block;font-weight:400;font-size:13.5px;color:var(--ink3)}
.rk{font-size:12.5px;color:var(--ink3);white-space:nowrap}
.route-list a.done .rd{background:var(--sage);border-color:var(--sage)}
.route-list a.done .rt{color:var(--sage-ink)}
.route-list a.done .rk{color:var(--sage-ink);font-weight:700}

/* ---------- level ---------- */
.level{padding-top:64px;padding-bottom:8px}
.lv-head{display:flex;align-items:flex-end;gap:14px;border-top:2px solid var(--ink);padding-top:14px}
.lv-time{font-size:clamp(52px,15vw,76px);line-height:.86;color:var(--clay-ink);letter-spacing:-.02em}
.lv-meta{font-size:13.5px;line-height:1.45;color:var(--ink3);padding-bottom:4px}
.lv-title{margin:14px 0 6px;font-size:clamp(30px,8vw,40px);line-height:1.2;font-weight:800}
.lv-hook{margin:0;font-size:19px;line-height:1.6;color:var(--ink)}
.lv-src{margin:6px 0 0;font-size:12.5px;color:var(--ink3)}
.level.done .lv-time{color:var(--sage-ink)}

.voices-wrap{margin:20px 0 6px}
.voices-label{font-size:13px;color:var(--ink3);margin-bottom:8px}
.voices-label b{color:var(--sage-ink);display:none}
.level.done .voices-label span{display:none}
.level.done .voices-label b{display:inline}
.voices{display:flex;flex-wrap:wrap;gap:8px}
.voice{display:inline-grid;perspective:700px}
.voice>span{grid-area:1/1;padding:8px 14px;border-radius:18px 18px 18px 5px;font-size:14.5px;line-height:1.45;-webkit-backface-visibility:hidden;backface-visibility:hidden;transition:transform .7s cubic-bezier(.3,.7,.2,1)}
.v-neg{background:#fff;border:1px solid var(--stone)}
.v-pos{background:var(--sage-soft);border:1px solid rgba(85,105,61,.35);color:var(--sage-ink);transform:rotateX(180deg);font-weight:600}
.voice.flip .v-neg{transform:rotateX(-180deg)}
.voice.flip .v-pos{transform:rotateX(0)}

/* ---------- stage ---------- */
.stage{background:var(--sand);border-radius:24px;padding:18px 16px 16px;margin:18px 0}
.stage-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:4px}
.stage-h h3{margin:0;font-size:20px;font-weight:800;line-height:1.35}
.done-chip{display:none;font-size:13px;font-weight:700;color:var(--sage-ink);white-space:nowrap}
.stage.is-done .done-chip{display:inline}
.stage-tip{margin:0 0 14px;color:var(--ink2);font-size:15px}
.panel{background:#fff;border-radius:18px;border:1.5px solid var(--stone)}

/* feedback */
.fb:empty{display:none}
.fb{margin-top:12px}
.fb-card{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;padding:12px 14px;border-radius:16px;background:#fff;border:1.5px solid var(--stone);animation:pop .35s cubic-bezier(.2,.9,.3,1.25)}
.fb-card.ok{border-color:var(--sage)}
.fb-card.no{border-color:var(--brick)}
.fb-ico{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px;line-height:1}
.ok .fb-ico{background:var(--sage)}
.no .fb-ico{background:var(--brick)}
.fb-title{font-weight:700;font-size:15.5px;line-height:1.55}
.fb-note{margin-top:3px;font-size:14.5px;color:var(--ink2)}
.fb-voice{margin-top:6px;font-size:14.5px;color:var(--ink2);line-height:1.55}
.fb-vl{display:inline-block;font-size:12px;font-weight:700;color:var(--clay-ink);background:var(--clay-soft);border-radius:6px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.fb-next{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:10px;font-weight:700}

/* choices */
.choices{display:grid;gap:10px}
.choice{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:13px 14px;border-radius:14px;border:1.5px solid var(--stone);background:#fff;font-size:15.5px;line-height:1.5}
.choice:hover{border-color:var(--pebble)}
.choice .k{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--num);font-size:15px;background:var(--sand)}
.choice.right{border-color:var(--sage);background:var(--sage-soft)}
.choice.right .k{background:var(--sage);color:#fff}
.choice.wrong{border-color:var(--brick);background:var(--brick-soft);animation:shake .4s}
.choice.wrong .k{background:var(--brick);color:#fff}
.choice[disabled]{cursor:default}
.q-text{margin:0 0 12px;font-weight:700;font-size:17px;line-height:1.55}

/* number flip cards */
.nums-wrap{margin:22px 0 6px}
.nums-label{font-size:13px;color:var(--ink3);margin-bottom:8px}
.nums{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.nums{grid-template-columns:repeat(3,minmax(0,1fr))}}
.nc{display:block;border:0;padding:0;background:none;height:138px;text-align:left;perspective:900px;width:100%}
.nc-in{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.7,.2,1)}
.nc.open .nc-in{transform:rotateY(180deg)}
.nc-f,.nc-b{position:absolute;left:0;top:0;right:0;bottom:0;border-radius:18px;-webkit-backface-visibility:hidden;backface-visibility:hidden;padding:13px 14px;display:flex;flex-direction:column;justify-content:space-between}
.nc-f{background:#fff;border:1.5px solid var(--stone)}
.nc-b{background:var(--night);color:var(--paper);transform:rotateY(180deg);justify-content:flex-start;gap:6px}
.nc-q{font-size:12.5px;color:var(--ink3)}
.nc-n{display:block;font-family:var(--num);font-size:38px;line-height:1;color:var(--clay-ink);letter-spacing:-.01em}
.nc-n small{font-size:17px;margin-left:3px;color:var(--ink2);font-family:var(--cn)}
.nc-n2{font-family:var(--num);font-size:20px;color:#F2B79F;line-height:1.1}
.nc-t{font-size:14px;line-height:1.5}

/* chant */
.chant{position:relative;margin:22px 0 8px;padding:20px 18px 18px;border-radius:22px;background:var(--clay-soft);border:1.5px dashed rgba(180,84,47,.45)}
.chant-label{font-size:13px;color:var(--clay-ink);font-weight:800}
.chant-text{margin:6px 0 0;font-size:clamp(20px,5.6vw,25px);line-height:1.6;font-weight:800;letter-spacing:.04em}
.chant .stamp{position:absolute;right:14px;top:-16px;transform:rotate(9deg);border:2.5px solid var(--sage-ink);color:var(--sage-ink);background:var(--paper);font-weight:800;font-size:14px;padding:3px 10px;border-radius:8px;display:none}
.level.done .chant .stamp{display:block;animation:stampIn .45s cubic-bezier(.2,.9,.3,1.4)}

/* standards */
details.std{margin-top:14px;border-top:1px solid var(--stone)}
details.std summary{list-style:none;cursor:pointer;padding:14px 0;font-weight:700;color:var(--ink2);display:flex;justify-content:space-between;align-items:center;gap:10px}
details.std summary::-webkit-details-marker{display:none}
details.std summary::after{content:"+";font-family:var(--num);font-size:24px;line-height:1;color:var(--ink3)}
details.std[open] summary::after{content:"−"}
details.std h4{margin:6px 0 4px;font-size:14.5px}
details.std ul{margin:0 0 12px;padding-left:1.15em;color:var(--ink2);font-size:14.5px;line-height:1.75}

/* ---------- L1 gate ---------- */
.seg-row{display:flex;gap:8px;margin-bottom:12px}
.seg{flex:1;min-height:46px;border-radius:14px;border:1.5px solid var(--stone);background:#fff;font-weight:800;font-size:16px}
.seg[aria-selected="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.seg .num{font-weight:400;margin-left:8px;opacity:.75;font-size:15px}
.gate{position:relative;margin:0 auto;max-width:340px;border:2px solid var(--ink);border-radius:170px 170px 22px 22px;background:#fff;padding:36px 8px 4px;overflow:hidden}
.gate-label{position:absolute;top:13px;left:0;right:0;text-align:center;font-size:12.5px;color:var(--ink3);letter-spacing:.12em}
.gate-led{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--brick);margin-right:6px;vertical-align:1px}
.gate.clear .gate-led{background:var(--sage)}
.scanline{position:absolute;left:0;right:0;top:0;height:3px;background:var(--clay);box-shadow:0 0 16px 6px rgba(217,119,87,.35);opacity:0;pointer-events:none;z-index:2}
.gate.scan .scanline{animation:scan 1.9s ease-in-out 1}
@keyframes scan{0%{top:6%;opacity:0}10%{opacity:1}90%{opacity:1}100%{top:97%;opacity:0}}
.fig svg{width:100%;height:auto}
.fig .hs{cursor:pointer}
.fig .w,.fig .r{transition:opacity .45s ease}
.fig .r{opacity:0}
.fig .r.on{opacity:1}
.fig .w.off{opacity:0}
.hint-ring{fill:none;stroke:var(--clay);stroke-width:3;stroke-dasharray:6 5;opacity:0}
.hs.hint .hint-ring{opacity:1;animation:blink 1s ease-in-out 3}
.hs.found .hint-ring{opacity:0}
.spark line{stroke:var(--clay);stroke-width:3;stroke-linecap:round}
.spark g{transform-box:fill-box;transform-origin:center;animation:spark .7s ease-out forwards}
.gate-bar{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px}
.counter{font-size:15px;color:var(--ink2)}
.counter b{font-family:var(--num);font-size:24px;color:var(--ink);font-weight:400}

/* ---------- L2 desk & wall ---------- */
.desk{padding:8px;max-width:560px;margin:0 auto}
.desk svg{width:100%;height:auto}
.desk .item{cursor:pointer;transition:transform .7s cubic-bezier(.45,-0.25,.35,1.05),opacity .55s ease}
.desk .item.gone{opacity:0;pointer-events:none}
.desk .item.down text{opacity:0}
.desk .item .ico{transform-box:fill-box;transform-origin:center}
.desk .item.wiggle .ico{animation:wiggle .45s}
.desk .done-item{pointer-events:none}
.tape{fill:none;stroke:var(--mustard);stroke-width:3.2;stroke-dasharray:100;stroke-dashoffset:100;animation:tape .9s ease forwards}
.three{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.three span{padding:6px 12px;border-radius:10px;background:#FBF1D6;border:1.5px solid var(--mustard);font-weight:800;font-size:14.5px}
.wall{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:12px 10px;border-radius:16px;background:#EAE3D4;border:2px solid var(--ink)}
.frame{min-height:84px;border-radius:8px;border:1.5px dashed var(--pebble);background:rgba(255,255,255,.55);display:flex;align-items:center;justify-content:center;font-size:12px;line-height:1.35;text-align:center;padding:5px 3px;color:var(--pebble);font-family:var(--num)}
.frame.filled{border:1.5px solid var(--ink);background:#fff;color:var(--ink);font-family:var(--cn);font-weight:700;animation:pop .4s cubic-bezier(.2,.9,.3,1.3)}
.frame.filled::before{content:"";display:block}
.tiles{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tile{padding:10px 14px;border-radius:12px;border:1.5px solid var(--stone);background:#fff;font-size:15px;line-height:1.4;text-align:left}
.tile:hover{border-color:var(--pebble)}
.tile.wrong{border-color:var(--brick);background:var(--brick-soft);animation:shake .4s}
.tile.used{visibility:hidden}

/* ---------- L3 flow & bow ---------- */
.slots{display:grid;gap:8px;margin-bottom:12px;counter-reset:slot}
.slot{display:flex;align-items:center;gap:10px;min-height:50px;padding:8px 12px;border-radius:14px;border:1.5px dashed var(--pebble);color:var(--pebble);font-size:15px;line-height:1.45}
.slot::before{counter-increment:slot;content:counter(slot);flex:none;font-family:var(--num);font-size:17px;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--stone);color:var(--ink2)}
.slot.filled{border-style:solid;border-color:var(--sage);background:#fff;color:var(--ink);animation:pop .35s cubic-bezier(.2,.9,.3,1.3)}
.slot.filled::before{background:var(--sage);color:#fff}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.bow-card{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--night);color:var(--paper);margin-bottom:10px}
.bow-step{font-size:15px;color:#C9C6BB;flex:none}
.bow-card p{margin:0;font-size:18px;font-weight:800;line-height:1.4}
.bow-scene{position:relative;padding:6px}
.bow-read{position:absolute;right:16px;bottom:12px;font-size:48px;line-height:1;color:var(--ink)}
.bow-scene{max-width:440px;margin:0 auto}
.bow-card{max-width:440px;margin-left:auto;margin-right:auto}
.bow-ctrl{max-width:440px;margin-left:auto;margin-right:auto}
.bow-ctrl{margin-top:10px}
.range{width:100%;height:40px;accent-color:var(--clay-ink);margin:0}
.range-scale{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);font-family:var(--num);margin:-4px 2px 10px}
.sensor-box{margin-top:10px;padding:12px 14px;border-radius:14px;background:#fff;border:1.5px solid var(--sky);font-size:14.5px;color:var(--ink2)}
.sensor-box b{color:var(--ink)}
.hold{height:6px;border-radius:9px;background:var(--stone);overflow:hidden;margin-top:8px}
.hold i{display:block;height:100%;width:0;background:var(--sage);transition:width .1s linear}
.bow-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.bow-sum div{background:#fff;border-radius:14px;padding:10px;text-align:center;border:1.5px solid var(--stone)}
.bow-sum b{display:block;font-family:var(--num);font-size:30px;line-height:1.1;color:var(--clay-ink);font-weight:400}
.bow-sum span{font-size:13.5px;color:var(--ink2)}

/* ---------- L4 ---------- */
.stairs{padding:6px;max-width:480px;margin:0 auto}
.stairs .ghost{cursor:pointer}
.stairs .ghost .gs{fill:rgba(255,255,255,.6);stroke:var(--ink3);stroke-width:2;stroke-dasharray:5 4}
.stairs .ghost:hover .gs{stroke:var(--clay-ink)}
.stairs .ghost text{font-size:12.5px;fill:var(--ink2);font-weight:700}
.stairs .owner-tilt{transform-box:fill-box;transform-origin:50% 100%;transition:transform .7s cubic-bezier(.5,0,.5,1)}
.stairs .you{transition:opacity .3s}
.stairs .stars{opacity:0;transition:opacity .3s}
.stairs.fall .stars{opacity:1}
.mode-row{display:flex;gap:8px;margin-bottom:10px}
.shake-wrap{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 8px}
.shake-btn{position:relative;width:176px;height:176px;border-radius:50%;border:0;background:transparent;padding:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
.shake-btn svg{width:100%;height:100%}
.shake-btn .ring-p{transition:stroke-dashoffset .05s linear}
.shake-btn.held .hands{transform:scale(.94);transform-origin:center;transform-box:fill-box}
.shake-time{font-size:34px;line-height:1}
.shake-hint{font-size:13px;color:var(--ink3);text-align:center}
.biz{position:relative;height:250px;border-radius:18px;background:#E9D9BC;border:2px solid var(--ink);overflow:hidden}
.biz .who{position:absolute;left:0;right:0;text-align:center;font-size:13px;font-weight:800;color:var(--ink2)}
.biz .who.top{top:10px}.biz .who.bot{bottom:10px}
.biz .person{position:absolute;left:50%;width:56px;height:28px;margin-left:-28px;border-radius:28px 28px 0 0;background:var(--sky);border:2px solid var(--ink)}
.biz .person.top{top:-2px;border-radius:0 0 28px 28px;top:30px;transform:none}
.biz .person.bot{bottom:30px;background:var(--clay)}
.card-biz{position:absolute;left:50%;top:50%;width:186px;height:104px;margin:-52px 0 0 -93px;border-radius:10px;background:#fff;border:1.5px solid var(--ink);box-shadow:0 6px 16px -10px rgba(0,0,0,.6);padding:12px 14px;transition:transform .55s cubic-bezier(.3,.7,.2,1);cursor:pointer;text-align:left}
.card-biz span{display:block}
.card-biz .cb-a{font-size:11px;color:var(--ink3)}
.card-biz .cb-n{font-size:20px;font-weight:800;line-height:1.25;margin:1px 0 2px}
.card-biz .cb-t{font-size:11.5px;line-height:1.5;color:var(--ink2)}
.card-biz .cb-bar{position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--clay);border-radius:10px 0 0 10px}
.card-biz.rot{transform:rotate(180deg)}
.card-biz.given{transform:rotate(180deg) translateY(62px)}
.card-biz.given-wrong{transform:translateY(-62px)}
.quick{padding:16px}
.quick-n{font-size:13px;color:var(--ink3);font-family:var(--num)}
.quick-q{font-size:18px;font-weight:800;line-height:1.55;margin:6px 0 14px;min-height:3.1em}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tf .btn{min-height:52px;font-size:18px}
.tf .btn.t{border-color:var(--sage-ink);color:var(--sage-ink)}
.tf .btn.f{border-color:var(--brick);color:var(--brick)}

/* ---------- L5 ---------- */
.callbox{padding:14px}
.call-top{display:flex;align-items:center;gap:14px}
.landline{width:128px;flex:none}
.landline .handset{transform-box:fill-box;transform-origin:center}
.landline.ringing .handset{animation:ringing .16s linear infinite}
.ring-info{flex:1}
.ring-n{font-size:40px;line-height:1}
.ring-l{font-size:13px;color:var(--ink3)}
.chat{display:grid;gap:10px;margin-top:14px}
.msg{max-width:92%;padding:10px 14px;border-radius:16px;font-size:15px;line-height:1.55;background:var(--sand)}
.msg.them{border-bottom-left-radius:4px}
.msg.me{justify-self:end;background:var(--clay-soft);border-bottom-right-radius:4px}
.msg.sys{justify-self:center;background:transparent;color:var(--ink3);font-size:13.5px;padding:0}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:0 14px;border-radius:999px;border:1.5px solid var(--stone);background:#fff;font-size:15px;line-height:1.3}
.chip:hover{border-color:var(--pebble)}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--paper)}
.chip.right{border-color:var(--sage);background:var(--sage-soft);color:var(--ink)}
.chip.wrong{border-color:var(--brick);background:var(--brick-soft);color:var(--ink);animation:shake .4s}
.chip .num{font-size:17px}
.safe{background:var(--night);color:var(--paper);border-radius:22px;padding:16px;border:2px solid var(--ink)}
.safe-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#BDB9AE;margin-bottom:10px}
.dials{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.dial{background:#1C1B19;border-radius:12px;padding:10px 4px 8px;text-align:center;border:1.5px solid #45433E;transition:border-color .3s}
.dial b{display:block;font-family:var(--num);font-weight:400;font-size:38px;line-height:1.05;color:#5E5C56;transition:color .3s}
.dial span{font-size:12px;color:#A8A59C}
.dial.ok{border-color:var(--clay)}
.dial.ok b{color:#F0A283}
.safe-qs{display:grid;gap:14px;margin-top:16px}
.sq p{margin:0 0 7px;font-size:15px;color:#ECEAE2;line-height:1.5}
.sq p .num{color:#F0A283;margin-right:6px}
.sq .opts{display:flex;gap:6px;flex-wrap:wrap}
.sq button{min-height:40px;padding:0 13px;border-radius:10px;border:1.5px solid #55534D;background:transparent;color:var(--paper);font-size:14.5px}
.sq button.right{border-color:var(--clay);background:rgba(217,119,87,.22)}
.sq button.wrong{border-color:#C9604F;animation:shake .4s}
.safe-open{margin-top:16px;padding:14px;border-radius:14px;background:rgba(217,119,87,.16);border:1.5px solid var(--clay);text-align:center;animation:pop .45s cubic-bezier(.2,.9,.3,1.3)}
.safe-open .code{font-family:var(--num);font-size:56px;letter-spacing:.06em;line-height:1.1;color:#F7C2AC}
.safe-open p{margin:4px 0 0;font-weight:800;font-size:18px}
.esc{padding:14px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.day{min-height:52px;border-radius:12px;border:1.5px solid var(--stone);background:#fff;padding:4px 0;line-height:1.15}
.day b{display:block;font-family:var(--num);font-weight:400;font-size:20px}
.day span{font-size:11px;color:var(--ink3)}
.day[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.day[aria-pressed="true"] span{color:#C9C6BB}
.day.mark{border-color:var(--clay)}
.ladder{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:12px 0 10px}
.rung{padding:8px 4px;border-radius:12px;text-align:center;font-size:13px;line-height:1.35;color:var(--ink3);background:var(--sand);border:1.5px solid transparent;transition:all .3s}
.rung.on{background:var(--clay-soft);border-color:var(--clay);color:var(--ink);font-weight:800}
.esc-text{font-size:15.5px;line-height:1.65;min-height:5em}
.esc-text .tag{display:inline-block;font-size:12px;font-weight:800;color:#fff;background:var(--clay-ink);border-radius:6px;padding:1px 7px;margin-right:6px;vertical-align:2px}

/* ---------- L6 deck ---------- */
.deck{position:relative;height:262px;margin:2px 0 12px}
.gcard{position:absolute;left:0;top:0;right:0;bottom:0;border-radius:20px;background:#fff;border:2px solid var(--ink);padding:18px;display:flex;flex-direction:column;justify-content:space-between;touch-action:pan-y;-webkit-user-select:none;user-select:none;transition:transform .35s cubic-bezier(.3,.7,.2,1),opacity .35s}
.gcard.back{transform:translateY(12px) scale(.95);opacity:.55;z-index:0}
.gcard.front{z-index:1}
.gcard.drag{transition:none}
.gcard .gc-n{font-family:var(--num);font-size:14px;color:var(--ink3)}
.gcard .gc-q{font-size:19px;font-weight:800;line-height:1.55;margin:6px 0}
.gcard .gc-tip{font-size:13px;color:var(--ink3)}
.gc-stamp{position:absolute;top:18px;right:16px;padding:3px 10px;border:3px solid;border-radius:8px;font-weight:900;font-size:18px;transform:rotate(12deg);opacity:0;background:#fff}
.gc-stamp.stop{color:var(--brick);border-color:var(--brick)}
.gc-stamp.pass{color:var(--sage-ink);border-color:var(--sage-ink);left:16px;right:auto;transform:rotate(-12deg)}
.gate-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.stop{border-color:var(--brick);color:var(--brick);min-height:52px;font-size:17px}
.btn.pass{border-color:var(--sage-ink);color:var(--sage-ink);min-height:52px;font-size:17px}
.room-icons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.room-icons div{background:#fff;border:1.5px solid var(--stone);border-radius:14px;padding:10px 6px;text-align:center;font-size:13px;line-height:1.35;color:var(--ink2)}
.room-icons svg{width:34px;height:34px;margin:0 auto 4px}
.path3{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:12px;font-size:14.5px}
.path3 span{padding:6px 12px;border-radius:10px;background:#fff;border:1.5px solid var(--ink);font-weight:800}
.path3 i{font-style:normal;color:var(--ink3)}

/* ---------- L7 ---------- */
.door-wrap{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:center}
.door{border:0;padding:0;background:none;width:132px;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.door svg{width:100%;height:auto}
.door .panel{transform-box:fill-box;transform-origin:left center;transition:transform .9s cubic-bezier(.3,.7,.2,1)}
.door.open .panel{transform:scaleX(.16)}
.door .peek{opacity:0;transition:opacity .5s .4s}
.door.open .peek{opacity:1}
.door.bump svg{animation:bump .14s}
.rhythm{min-height:120px}
.taps{display:flex;align-items:center;gap:6px;min-height:28px;flex-wrap:wrap}
.taps i{width:14px;height:14px;border-radius:50%;background:var(--clay);display:inline-block;animation:pop .2s}
.taps .gap{width:auto;height:auto;background:none;border-radius:0;font-style:normal;font-size:12.5px;color:var(--ink3);font-family:var(--num);padding:0 4px;animation:none}
.gapbar{position:relative;height:12px;border-radius:9px;background:var(--stone);margin:12px 0 4px;overflow:hidden}
.gapbar i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--sky)}
.gapbar .zone{position:absolute;top:0;bottom:0;left:50%;width:31%;background:rgba(120,140,93,.35);border-left:2px solid var(--sage);border-right:2px solid var(--sage)}
.gapnums{position:relative;height:16px;font-size:11.5px;color:var(--ink3);font-family:var(--num)}
.gapnums span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap}
.gapnums span:first-child{transform:none}.gapnums span:last-child{transform:translateX(-100%)}
.alldone{margin:12px 0 0;padding:10px 14px;border-radius:14px;background:var(--sage-soft);color:var(--sage-ink);font-weight:700;font-size:15px}
.alldone a{color:var(--sage-ink)}
.desk .item,.stairs .ghost,.fig .hs{outline:none}
.desk .item:focus-visible>rect:first-child,.stairs .ghost:focus-visible>rect:first-child{stroke:var(--sky);stroke-width:3}
.fig .hs:focus-visible .hint-ring{opacity:1;stroke:var(--sky)}
.gap-live{font-size:30px;line-height:1.1;margin-top:6px}
.steps{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:8px;counter-reset:st}
.steps li{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:14px;padding:10px 12px;border:1.5px solid var(--stone);font-size:15px;line-height:1.5}
.steps li::before{counter-increment:st;content:counter(st);flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--paper);font-family:var(--num);font-size:15px}

/* ---------- exam ---------- */
.exam-card{background:var(--sand);border-radius:24px;padding:18px 16px}
.exam-prog{display:flex;gap:4px;margin-bottom:14px}
.exam-prog i{flex:1;height:6px;border-radius:9px;background:var(--stone)}
.exam-prog i.cur{background:var(--ink)}
.exam-prog i.ok{background:var(--sage)}
.exam-prog i.no{background:var(--brick)}
.exam-meta{display:flex;justify-content:space-between;font-size:13px;color:var(--ink3);margin-bottom:6px}
.exam-q{font-size:19px;font-weight:800;line-height:1.55;margin:0 0 14px}
.exam-exp{margin-top:12px;padding:12px 14px;border-radius:14px;background:#fff;border:1.5px solid var(--stone);font-size:15px;line-height:1.6}
.result{text-align:center;padding:10px 0}
.result .score{font-family:var(--num);font-size:92px;line-height:1;color:var(--clay-ink)}
.result .score small{font-size:34px;color:var(--ink3)}
.result h3{margin:6px 0 4px;font-size:22px}
.review{text-align:left;margin:16px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.review li{background:#fff;border-radius:14px;padding:10px 12px;border:1.5px solid var(--stone);font-size:14.5px;line-height:1.55}
.review b{display:block}
.namefield{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap;justify-content:center}
.namefield input{flex:1;min-width:150px;max-width:260px;min-height:46px;border-radius:999px;border:1.5px solid var(--ink);padding:0 18px;background:#fff;font-size:16px}
.imgout{margin-top:16px;text-align:center}
.imgout img{width:100%;max-width:360px;border-radius:16px;border:1.5px solid var(--stone);box-shadow:0 12px 30px -20px rgba(0,0,0,.5)}
.imgout p{font-size:13.5px;color:var(--ink3);margin:8px 0}

/* ---------- chants wall ---------- */
.cw{display:grid;gap:10px}
@media (min-width:640px){.cw{grid-template-columns:1fr 1fr}}
.cw-item{padding:14px 16px;border-radius:18px;background:#fff;border:1.5px solid var(--stone)}
.cw-top{display:flex;align-items:baseline;gap:8px}
.cw-time{font-family:var(--num);color:var(--clay-ink);font-size:20px}
.cw-name{font-size:13px;color:var(--ink3)}
.cw-text{font-size:18px;font-weight:800;line-height:1.6;margin:4px 0 8px;letter-spacing:.02em}
.cw-nums{display:flex;flex-wrap:wrap;gap:6px}
.cw-nums span{font-size:12.5px;padding:3px 9px;border-radius:99px;background:var(--sand);color:var(--ink2)}

/* ---------- tomorrow ---------- */
.lineup{position:relative;border-radius:24px;background:var(--night);color:var(--paper);padding:20px 18px;overflow:hidden}
.lineup .lu-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#C9C6BB}
.lineup .lu-no{font-family:var(--num);font-size:15px}
.lineup h3{margin:12px 0 6px;font-size:24px;line-height:1.3}
.lineup p{margin:0;font-size:16px;line-height:1.7;color:#ECEAE2}
.lineup .lu-time{display:inline-block;margin-top:12px;font-size:12.5px;color:#F0A283;border:1px solid rgba(240,162,131,.5);border-radius:99px;padding:2px 10px}
.lineup.flipin{animation:flipin .5s cubic-bezier(.3,.7,.2,1)}
.commit{display:grid;gap:8px}
.commit label{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:#fff;border:1.5px solid var(--stone);font-size:15px;line-height:1.55;cursor:pointer}
.commit input{margin-top:5px;width:18px;height:18px;accent-color:var(--clay-ink);flex:none}
.commit label.on{border-color:var(--clay-ink);background:var(--clay-soft)}
.commit .when{color:var(--ink3)}
.rhythm-strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:6px}
.rhythm-strip div{background:#fff;border:1.5px solid var(--stone);border-radius:14px;padding:10px 8px;font-size:13px;line-height:1.45;color:var(--ink2)}
.rhythm-strip b{display:block;font-family:var(--num);font-weight:400;font-size:24px;color:var(--clay-ink);line-height:1.1}
.rhythm-strip strong{display:block;color:var(--ink);font-size:13.5px}

/* ---------- trainer & footer ---------- */
.trainer{margin-top:48px}
.trainer details{border-radius:22px;background:var(--sand);padding:4px 16px}
.trainer summary{list-style:none;cursor:pointer;padding:14px 0;font-weight:800;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.trainer summary::-webkit-details-marker{display:none}
.trainer summary::after{content:"+";font-family:var(--num);font-size:26px;color:var(--ink3)}
.trainer details[open] summary::after{content:"−"}
.trainer h4{margin:16px 0 6px;font-size:16px}
.trainer ol,.trainer ul{margin:0 0 8px;padding-left:1.2em;font-size:14.5px;line-height:1.75;color:var(--ink2)}
.trainer table{width:100%;border-collapse:collapse;font-size:14px;margin-bottom:8px}
.trainer td{padding:7px 4px;border-bottom:1px solid var(--stone);vertical-align:top;color:var(--ink2)}
.trainer td:first-child{white-space:nowrap;color:var(--ink);font-weight:700;padding-right:10px}
.method{display:grid;gap:8px;margin-bottom:10px}
.method div{background:#fff;border-radius:14px;padding:10px 12px;border:1.5px solid var(--stone);font-size:14px;line-height:1.6;color:var(--ink2)}
.method b{color:var(--ink)}
.method em{font-style:normal;color:var(--clay-ink);font-weight:700}
footer{margin-top:40px;padding:22px 0 calc(40px + env(safe-area-inset-bottom));border-top:1px solid var(--stone);font-size:13px;color:var(--ink3);line-height:1.7}
footer p{margin:0 0 6px}
.linkbtn{border:0;background:none;padding:0;color:var(--clay-ink);text-decoration:underline;font-size:13px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,30px);max-width:calc(100% - 32px);background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:16px;font-size:15px;font-weight:700;line-height:1.5;box-shadow:0 14px 30px -14px rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.2,.8,.2,1);z-index:60;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* keyframes */
@keyframes pop{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
@keyframes spark{0%{transform:scale(.4);opacity:1}100%{transform:scale(1.5);opacity:0}}
@keyframes tape{to{stroke-dashoffset:0}}
@keyframes ringing{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes bump{0%{transform:translateX(0)}50%{transform:translateX(-3px) rotate(-.6deg)}100%{transform:translateX(0)}}
@keyframes stampIn{0%{transform:rotate(9deg) scale(1.8);opacity:0}100%{transform:rotate(9deg) scale(1);opacity:1}}
@keyframes flipin{0%{transform:rotateX(70deg);opacity:0}100%{transform:rotateX(0);opacity:1}}

@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto}
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
@media print{
  .topbar,.hero .screen,.stage,.toast,footer .linkbtn{display:none!important}
}


/* 左上角返回主页按钮，作品页统一；这一页放进顶栏左侧 */
.pf-back{position:fixed;top:calc(9px + env(safe-area-inset-top,0px));left:16px;z-index:45;display:inline-flex;align-items:center;gap:7px;
  min-height:36px;padding:8px 14px 8px 10px;border-radius:999px;font:500 13px/1.2 var(--cn);color:var(--ink);text-decoration:none;
  background:var(--paper);border:1px solid rgba(20,20,19,.14);opacity:.94;transition:opacity .2s,border-color .2s}
.pf-back:hover,.pf-back:focus-visible{opacity:1;border-color:var(--ink3)}
.pf-back:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:999px}
.pf-back svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:1019px){.topbar .brand{display:none}.topbar .bar{padding-left:124px}}
@media (max-width:519px){.meter-label{display:none}}
@media print{.pf-back{display:none !important}}

<script>/* 整份作品禁止复制：拦截复制、剪切、右键菜单、选中与拖拽（输入框和生成的卡片图片除外）；禁止打印 */
(function(){
  function allowed(e){
    var el = e.target; if (el && el.nodeType === 3) el = el.parentNode;
    return !!(el && el.closest && el.closest('input, textarea, select, .imgout img'));
  }
  ['copy', 'cut'].forEach(function(t){ document.addEventListener(t, function(e){ if (allowed(e)) return; e.preventDefault(); if (e.clipboardData) e.clipboardData.setData('text/plain', ''); }); });
  ['contextmenu', 'selectstart', 'dragstart'].forEach(function(t){ document.addEventListener(t, function(e){ if (!allowed(e)) e.preventDefault(); }); });
  window.print = function(){};
})();
</script>
